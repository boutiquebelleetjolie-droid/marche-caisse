<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caisse – Marché des Artisans et Producteurs</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#2d2a26">
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{--bg:#f7f3ec;--card:#fff;--ink:#2d2a26;--muted:#7a7268;--osb:#c99a5b;--osb-d:#9a6f37;--sauge:#6f8f72;--sauge-d:#4f6d52;--rouge:#b5483b;--line:#e6dfd3;--r:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .who{font-size:13px;opacity:.85}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:#ece5d8;border-bottom:1px solid var(--line)}
  nav button{background:transparent;border:1px solid transparent;padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--ink)}
  nav button.on{background:#fff;border-color:var(--line);font-weight:600}
  main{padding:16px;max-width:1200px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:14px 0 8px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
  textarea{min-height:60px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--sauge);color:#fff}
  .btn:hover{background:var(--sauge-d)}
  .btn.osb{background:var(--osb)} .btn.osb:hover{background:var(--osb-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--rouge)}
  .btn.small{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1;min-width:140px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:700;margin-top:4px}
  .muted{color:var(--muted);font-size:13px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#efe7da}
  .tag.off{background:#f3d9d5;color:var(--rouge)}
  .login{max-width:380px;margin:40px auto}
  .msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
  .msg.err{background:#f8e1dd;color:#8a2e23} .msg.ok{background:#e2efe3;color:#2f5b33}
  /* Caisse */
  .caisse{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
  @media(max-width:900px){.caisse{grid-template-columns:1fr}}
  .scan{font-size:20px;padding:14px;border:2px solid var(--osb)}
  .results{max-height:52vh;overflow:auto;margin-top:10px}
  .prod{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
  .prod:hover{border-color:var(--osb)}
  .prod b{display:block}
  .cart-line{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
  .total{font-size:30px;font-weight:800;text-align:right;margin:12px 0}
  .pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .offline{background:#fff3cd;color:#856404;padding:8px 12px;border-radius:10px;margin:6px 0;font-size:14px}
  .plan td{vertical-align:top}
  .slot{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
  .pill{display:inline-flex;gap:4px;align-items:center;padding:3px 8px;border-radius:999px;background:#e2efe3;font-size:13px;font-weight:600}
  .pill.abs{background:#f8e1dd;color:#8a2e23;text-decoration:line-through}
  .pill.moi{background:var(--osb);color:#fff}
  .rendu{font-size:26px;font-weight:800;text-align:center;padding:12px;border-radius:10px;background:#e2efe3;color:#2f5b33;margin-top:10px}
  .rendu.manque{background:#f8e1dd;color:#8a2e23}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:10px;border-bottom:1px solid var(--line)}
  .bars div{flex:1;background:var(--sauge);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars div:hover{background:var(--osb)}
  .barlbl{display:flex;gap:4px;font-size:10px;color:var(--muted)}
  .barlbl span{flex:1;text-align:center;overflow:hidden}
  .periods{display:flex;gap:6px;flex-wrap:wrap}
  .periods button.on{background:var(--ink);color:#fff}
  .pay .btn{padding:16px 8px;font-size:16px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal .box{background:#fff;border-radius:var(--r);padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
  .hidden{display:none!important}
  /* Ticket */
  #ticket{font-family:"Courier New",monospace;font-size:13px;width:72mm;margin:0 auto;color:#000}
  #ticket .c{text-align:center} #ticket hr{border:0;border-top:1px dashed #000}
  #ticket .l{display:flex;justify-content:space-between;gap:6px}
  #ticket svg{width:100%;height:100%;display:block}
  /* Étiquettes */
  #labels{display:flex;flex-wrap:wrap;gap:6px}
  .label{width:62mm;border:1px dashed #bbb;padding:6px;text-align:center;font-size:11px;background:#fff}
  .label .p{font-size:15px;font-weight:700}
  @media print{
    body *{visibility:hidden}
    .print-zone,.print-zone *{visibility:visible}
    .print-zone{position:absolute;left:0;top:0;width:100%}
    .modal{background:none}
    .label{border:0;break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <h1 id="titre">Marché des Artisans et Producteurs</h1>
  <div class="who"><span id="who"></span> <button class="btn small ghost hidden" id="btnLogout">Se déconnecter</button></div>
</header>
<nav id="nav" class="hidden"></nav>
<main id="app"></main>

<div class="modal hidden" id="modal"><div class="box" id="modalBox"></div></div>

<script>
// ================== Outils ==================
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const eur = (c) => ((c || 0) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const thisMonth = () => new Date().toISOString().slice(0, 7);
const libMode = (k) => ({ CB: "Carte bancaire", "Bon d'achat": "Bons, avoirs, cartes cadeaux utilisés (pas dans le tiroir)", "Avoir émis": "Avoirs émis pour des retours" }[k] || k);
const fdate = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
let S = { token: localStorage.getItem("token"), role: localStorage.getItem("role"), nom: localStorage.getItem("nom"), cle: localStorage.getItem("cleCaisse"), initiales: localStorage.getItem("initiales") || "", settings: {} };

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  if (S.token) headers.authorization = "Bearer " + S.token;
  if (S.cle) headers["x-caisse"] = S.cle;
  const r = await fetch("/api" + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token && !path.startsWith("/login")) { logout(); throw new Error("Session expirée, reconnectez-vous"); }
  if (!r.ok) throw new Error(d.erreur || "Erreur");
  return d;
}
function msg(el, text, type = "err") { el.innerHTML = text ? `<div class="msg ${type}">${esc(text)}</div>` : ""; }
function openModal(html) { $("#modalBox").innerHTML = html; $("#modal").classList.remove("hidden"); }
function closeModal() { $("#modal").classList.add("hidden"); $("#modal").classList.remove("print-zone"); $("#modalBox").style.maxWidth = ""; }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

function setNav(items, active) {
  const nav = $("#nav");
  nav.classList.remove("hidden");
  nav.innerHTML = items.map(([k, l]) => `<button data-k="${k}" class="${k === active ? "on" : ""}">${l}</button>`).join("");
  nav.querySelectorAll("button").forEach((b) => (b.onclick = () => route(b.dataset.k)));
}
function logout() {
  localStorage.removeItem("token"); localStorage.removeItem("role"); localStorage.removeItem("nom");
  S.token = S.role = S.nom = null; start();
}
$("#btnLogout").onclick = logout;

// ================== Démarrage ==================
async function start() {
  try { S.settings = await api("/settings/public"); } catch {}
  $("#titre").textContent = S.settings.nomBoutique || "Caisse";
  document.title = "Caisse – " + (S.settings.nomBoutique || "");
  $("#who").textContent = S.nom ? S.nom : "";
  $("#btnLogout").classList.toggle("hidden", !S.token);
  if (!S.token) return showLogin();
  route(S.role === "admin" ? (S.cle ? "caisse" : "dashboard") : "catalogue");
}

function showLogin() {
  $("#nav").classList.add("hidden");
  app.innerHTML = `
  <div class="login card">
    <h2>Connexion</h2>
    <p class="muted">Artisans : connectez-vous pour gérer votre catalogue et suivre vos ventes.</p>
    <label>Identifiant</label><input id="lid" autocomplete="username">
    <label>Mot de passe</label><input id="lpw" type="password" autocomplete="current-password">
    <div id="lmsg"></div>
    <button class="btn" id="lgo" style="width:100%;margin-top:12px">Se connecter</button>
    ${S.cle ? `<hr style="margin:18px 0;border:0;border-top:1px solid var(--line)"><button class="btn osb" id="opencaisse" style="width:100%">Ouvrir la caisse</button><p class="muted">Ce poste est activé comme caisse du magasin.</p>` : ""}
  </div>`;
  const go = async () => {
    try {
      const d = await api("/login", { method: "POST", body: { identifiant: $("#lid").value, motdepasse: $("#lpw").value } });
      S.token = d.token; S.role = d.role; S.nom = d.nom; S.initiales = d.initiales || "";
      localStorage.setItem("token", d.token); localStorage.setItem("role", d.role); localStorage.setItem("nom", d.nom); localStorage.setItem("initiales", S.initiales);
      start();
    } catch (e) { msg($("#lmsg"), e.message); }
  };
  $("#lgo").onclick = go;
  $("#lpw").onkeydown = (e) => { if (e.key === "Enter") go(); };
  if ($("#opencaisse")) $("#opencaisse").onclick = () => showCaisse();
}

function route(k) {
  const navA = [["caisse", "Caisse"], ["dashboard", "Tableau de bord et ventes"], ["planning", "Permanences"], ["suivi", "Loyers et suivi"], ["artisans", "Artisans"], ["produits", "Catalogue"], ["parametres", "Paramètres"]];
  const navR = [["catalogue", "Mon catalogue"], ["mesventes", "Mes ventes"], ["planning", "Permanences"], ["compte", "Mon compte"]];
  if (S.role === "admin") {
    setNav(navA, k);
    ({ dashboard: adminDashboard, caisse: showCaisse, ventes: adminVentes, planning: () => planningView(app), suivi: adminSuivi, artisans: adminArtisans, produits: adminProduits, parametres: adminParametres }[k] || adminDashboard)();
  } else {
    setNav(navR, k);
    ({ catalogue: artisanCatalogue, mesventes: artisanVentes, planning: () => planningView(app), compte: compteView }[k] || artisanCatalogue)();
  }
}

// ================== CAISSE ==================
let CART = [], PRODS = [];
async function showCaisse() {
  if (!S.cle) {
    app.innerHTML = `<div class="card"><h2>Caisse</h2><p>La caisse ne fonctionne que sur le poste du magasin.</p>
      ${S.role === "admin" ? `<p class="muted">Si vous êtes sur l'ordinateur de la boutique, activez-le comme caisse dans <b>Paramètres</b>.</p>` : ""}</div>`;
    return;
  }
  if (!S.token) { $("#nav").classList.add("hidden"); $("#btnLogout").classList.add("hidden"); }
  app.innerHTML = `
  <div class="caisse">
    <div class="card">
      <h2 style="margin:0 0 8px">Caisse</h2>
      <div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          <button class="btn small ghost" id="cJour">Ventes du jour</button>
          <button class="btn small ghost" id="cRetour">Retour / échange</button>
          ${S.role === "admin" && S.token ? `<button class="btn small ghost" id="cSortie">Sortie d'espèces</button>` : ""}
          <button class="btn small" id="cZ">Clôture / Ticket Z</button>
          <button class="btn small osb" id="cEtiq">Étiquettes</button>
          <button class="btn small ghost" id="cPlan">Permanences</button>
          <button class="btn small ghost" id="cReload">Actualiser les articles</button>
          ${!S.token ? `<button class="btn small ghost" id="cQuit">Fermer la caisse</button>` : ""}
        </div>
      </div>
      <div id="cSession"></div>
      <div id="cVendeur"></div>
      <div class="row" style="margin-bottom:8px"><button class="btn osb" id="cSac" style="flex:0 0 auto">+ Sac 0,20 €</button><button class="btn ghost" id="cCadeau" style="flex:0 0 auto">+ Carte cadeau</button></div>
      <input class="scan" id="scan" placeholder="Scanner ou taper une référence / un nom d'article" autofocus autocomplete="off">
      <div id="cmsg"></div>
      <div class="results" id="results"></div>
    </div>
    <div class="card">
      <h2>Ticket en cours</h2>
      <div id="cart"></div>
      <div class="row" style="margin-top:6px"><button class="btn small ghost" id="cRemT" style="flex:0 0 auto">Remise sur le ticket</button><span id="remT" class="muted" style="text-align:right"></span></div>
      <div id="bonZone"></div>
      <div class="total" id="total">0,00 €</div>
      <div class="pay">
        <button class="btn" data-pay="CB">Carte</button>
        <button class="btn osb" data-pay="Espèces">Espèces</button>
        <button class="btn ghost" data-pay="Mixte">Carte + espèces</button>
      </div>
      <button class="btn ghost" id="cBon" style="width:100%;margin-top:8px">Payer avec un bon d'achat, un avoir ou une carte cadeau</button>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost small" id="cAtt">Mettre en attente</button>
        <button class="btn ghost small" id="cAttList">Tickets en attente</button>
        <button class="btn ghost small" id="cClear">Vider le panier</button></div>
    </div>
  </div>`;
  $("#cReload").onclick = loadProds;
  $("#cJour").onclick = venteDuJour;
  if ($("#cSortie")) $("#cSortie").onclick = sortieEspeces;
  $("#cZ").onclick = clotureCaisse;
  loadSession();
  $("#cEtiq").onclick = () => printLabels(PRODS.filter((p) => p.ref !== "SAC"));
  if ($("#cQuit")) $("#cQuit").onclick = showLogin;
  $("#cClear").onclick = () => { if (!CART.length) return; justifier("Vider le panier", { type: "panier", detail: CART.map((l) => l.qte + " × " + l.nom).join(", "), montant: CART.reduce((t, l) => t + l.prix * l.qte, 0) }, () => { CART = []; renderCart(); }); };
  $("#cAtt").onclick = mettreEnAttente;
  $("#cPlan").onclick = () => { openModal(`<div id="planBox"></div><button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Fermer</button>`); $("#modalBox").style.maxWidth = "820px"; planningView($("#planBox"), true); };
  $("#cRemT").onclick = () => saisirRemise("Remise sur tout le ticket", REM_TICKET, (r) => { REM_TICKET = r; renderCart(); });
  $("#cSac").onclick = () => { const p = PRODS.find((x) => x.ref === "SAC"); if (p) addToCart(p); $("#scan").focus(); };
  $("#cAttList").onclick = listeAttente;
  $("#cRetour").onclick = retourClient;
  $("#cBon").onclick = saisirBon;
  $("#cCadeau").onclick = () => {
    const m = prompt("Montant de la carte cadeau (€) :", "20"); if (!m) return;
    const c = Math.round(parseFloat(m.replace(",", ".")) * 100);
    if (!(c > 0)) return alert("Montant incorrect");
    CART.push({ ref: "CADEAU", nom: "Carte cadeau", prix: c, artisanNom: "Carte cadeau", qte: 1, cadeau: true }); renderCart();
  };
  afficherVendeur();
  document.querySelectorAll("[data-pay]").forEach((b) => (b.onclick = () => payer(b.dataset.pay)));
  const scan = $("#scan");
  scan.oninput = () => renderResults(scan.value);
  scan.onkeydown = (e) => {
    if (e.key !== "Enter") return;
    const v = scan.value.trim().toUpperCase();
    const p = PRODS.find((x) => x.ref.toUpperCase() === v);
    if (p) { addToCart(p); scan.value = ""; renderResults(""); }
    else {
      const list = filterProds(scan.value);
      if (list.length === 1) { addToCart(list[0]); scan.value = ""; renderResults(""); }
      else msg($("#cmsg"), list.length ? "Plusieurs articles correspondent : cliquez sur le bon." : "Référence inconnue : " + scan.value);
    }
  };
  await loadProds();
  renderCart();
}
async function loadProds() {
  try { PRODS = await api("/caisse/produits"); localStorage.setItem("cacheProduits", JSON.stringify(PRODS)); msg($("#cmsg"), ""); }
  catch (e) {
    if (/pas activé/.test(e.message)) { localStorage.removeItem("cleCaisse"); S.cle = null; msg($("#cmsg"), e.message); }
    else { PRODS = JSON.parse(localStorage.getItem("cacheProduits") || "[]"); msg($("#cmsg"), "Hors connexion : articles chargés depuis la dernière synchronisation.", "ok"); }
  }
  renderResults($("#scan")?.value || ""); majBandeauHorsLigne();
}
function filterProds(q) {
  q = q.trim().toLowerCase();
  if (!q) return PRODS.slice(0, 40);
  return PRODS.filter((p) => p.ref.toLowerCase().includes(q) || p.nom.toLowerCase().includes(q) || (p.artisanNom || "").toLowerCase().includes(q)).slice(0, 60);
}
function renderResults(q) {
  const el = $("#results"); if (!el) return;
  const list = filterProds(q);
  el.innerHTML = list.map((p) => `
    <div class="prod" data-ref="${esc(p.ref)}">
      <div><b>${esc(p.nom)}</b><span class="muted">${esc(p.ref)} · ${esc(p.artisanNom)}${typeof p.stock === "number" ? " · stock " + p.stock : ""}</span>${p.dlc && p.dlc < ymd(new Date()) ? ' <span class="tag off">DLC dépassée</span>' : ""}</div>
      <div><b>${eur(p.prix)}</b></div>
    </div>`).join("") || `<p class="muted">Aucun article.</p>`;
  el.querySelectorAll(".prod").forEach((d) => (d.onclick = () => { addToCart(PRODS.find((p) => p.ref === d.dataset.ref)); $("#scan").value = ""; renderResults(""); $("#scan").focus(); }));
}
function addToCart(p) {
  if (p.dlc && p.dlc < ymd(new Date()) && !confirm(`Attention : la date limite de « ${p.nom} » est dépassée (${fd(p.dlc)}). Vendre quand même ?`)) return;
  const l = CART.find((x) => x.ref === p.ref);
  if (l) l.qte++; else CART.push({ ref: p.ref, nom: p.nom, prix: p.prix, artisanNom: p.artisanNom, qte: 1 });
  msg($("#cmsg"), ""); renderCart();
}
// ---- Remises ----
let REM_TICKET = null;
function calcRemise(r, base) {
  if (!r || !r.valeur) return 0;
  const v = Number(String(r.valeur).replace(",", "."));
  if (!(v > 0)) return 0;
  return Math.min(base, r.type === "%" ? Math.round((base * Math.min(v, 100)) / 100) : Math.round(v * 100));
}
let BON = null; // bon d'achat / avoir / carte cadeau utilisé sur le ticket en cours
function calcPanier() {
  const lignes = CART.map((l) => { const brut = l.prix * l.qte, rem = l.cadeau ? 0 : calcRemise(l.remise, brut); return { ...l, pu: l.prix, brut, remiseMontant: rem, total: brut - rem }; });
  const rem = lignes.filter((l) => !l.cadeau);
  const st = rem.reduce((t, l) => t + l.total, 0);
  const rt = calcRemise(REM_TICKET, st);
  if (rt > 0) { let reste = rt; rem.forEach((l, i) => { const part = i === rem.length - 1 ? reste : Math.round((rt * l.total) / st); l.total -= part; reste -= part; }); }
  const total = lignes.reduce((t, l) => t + l.total, 0);
  const partBon = BON ? Math.min(BON.solde, total) : 0;
  return { lignes, sousTotal: st, remiseTicket: rt, total, partBon, aPayer: total - partBon };
}
function saisirRemise(titre, actuelle, ok) {
  openModal(`<h2>${esc(titre)}</h2>
    <div class="row"><div><label>Type</label><select id="rTy"><option value="%" ${actuelle?.type !== "€" ? "selected" : ""}>Pourcentage (%)</option><option value="€" ${actuelle?.type === "€" ? "selected" : ""}>Montant (€)</option></select></div>
    <div><label>Valeur</label><input id="rVa" inputmode="decimal" value="${esc(actuelle?.valeur || "")}"></div></div>
    <div class="quick">${[5, 10, 15, 20, 30, 50].map((v) => `<button class="btn small ghost" data-rq="${v}">−${v} %</button>`).join("")}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="rDel">Retirer la remise</button><button class="btn" id="rOk">Appliquer</button></div>`);
  document.querySelectorAll("[data-rq]").forEach((b) => (b.onclick = () => { $("#rTy").value = "%"; $("#rVa").value = b.dataset.rq; }));
  $("#rDel").onclick = () => { closeModal(); ok(null); };
  $("#rOk").onclick = () => { const v = $("#rVa").value.trim(); closeModal(); ok(v ? { type: $("#rTy").value, valeur: v } : null); };
}
function renderCart() {
  const el = $("#cart"); if (!el) return;
  const P = calcPanier();
  el.innerHTML = P.lignes.map((l, i) => `
    <div class="cart-line">
      <div><b>${esc(l.nom)}</b><div class="muted">${esc(l.ref)} · ${esc(l.artisanNom)}</div>
        ${l.cadeau ? "" : `<button class="btn small ghost" data-rem="${i}" style="margin-top:4px;padding:2px 8px">${l.remise ? "Remise −" + esc(l.remise.valeur) + (l.remise.type === "%" ? " %" : " €") : "Remise"}</button>`}</div>
      <div class="qty">${l.cadeau ? "" : `<button data-i="${i}" data-d="-1">−</button><span>${l.qte}</span><button data-i="${i}" data-d="1">+</button>`}</div>
      <div class="num">${l.remiseMontant ? `<s class="muted">${eur(l.brut)}</s><br>` : ""}<b>${eur(l.brut - l.remiseMontant)}</b></div>
      <button class="btn small ghost" data-del="${i}">✕</button>
    </div>`).join("") || `<p class="muted">Scannez un article pour commencer.</p>`;
  el.querySelectorAll("[data-rem]").forEach((b) => (b.onclick = () => { const l = CART[+b.dataset.rem]; saisirRemise("Remise sur " + l.nom, l.remise, (r) => { l.remise = r; renderCart(); }); }));
  if ($("#remT")) $("#remT").textContent = P.remiseTicket ? `Sous-total ${eur(P.sousTotal)} · remise −${eur(P.remiseTicket)}` : "";
  const supprimer = (i, n) => { const l = CART[i]; justifier("Retirer un article du panier", { type: "ligne", detail: n + " × " + l.nom + " (" + l.artisanNom + ")", montant: l.prix * n }, () => { l.qte -= n; if (l.qte < 1) CART.splice(i, 1); renderCart(); }); };
  el.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { const i = +b.dataset.i; if (+b.dataset.d > 0) { CART[i].qte++; renderCart(); } else supprimer(i, 1); }));
  el.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => supprimer(+b.dataset.del, CART[+b.dataset.del].qte)));
  $("#total").textContent = eur(P.aPayer);
  if ($("#bonZone")) $("#bonZone").innerHTML = BON ? `<div class="msg ok">${esc(BON.type === "avoir" ? "Avoir" : "Carte cadeau")} ${esc(BON.code)} (solde ${eur(BON.solde)}) : −${eur(P.partBon)} <button class="btn small ghost" id="bonX">Retirer</button><div class="muted">Total du ticket ${eur(P.total)}</div></div>` : "";
  if ($("#bonX")) $("#bonX").onclick = () => { BON = null; renderCart(); };
}
async function saisirBon() {
  const code = prompt("Code du bon d'achat, de l'avoir ou de la carte cadeau (scanner ou taper) :"); if (!code) return;
  try {
    const b = await api("/caisse/bon/" + encodeURIComponent(code.trim().toUpperCase()));
    if (b.expire < ymd(new Date())) return alert("Ce bon a expiré le " + fd(b.expire));
    if (!(b.solde > 0)) return alert("Ce bon a déjà été entièrement utilisé.");
    BON = b; renderCart();
  } catch (e) { alert(navigator.onLine ? e.message : "Les bons d'achat ne peuvent être utilisés qu'avec une connexion internet."); }
}
const estGerant = () => S.role === "admin" && !!S.token;
// Demande une justification (sauf pour la gérance), l'enregistre dans le journal puis exécute l'action
function justifier(titre, infos, action, appel) {
  const envoyer = async (motif, par) => {
    if (appel) return appel(motif, par);
    await api("/caisse/journal", { method: "POST", body: { ...infos, motif, par } });
  };
  if (estGerant()) { envoyer("", "").then(action).catch((e) => alert(e.message)); return; }
  openModal(`<h2>${esc(titre)}</h2><p class="muted">Une justification est demandée. Elle sera transmise à la gérance.</p>
    ${infos.detail ? `<p><b>${esc(infos.detail)}</b></p>` : ""}
    <label>Votre nom *</label><input id="jPar" value="${esc(VENDEUR()?.nom || "")}"><label>Justification *</label><textarea id="jMot" placeholder="ex. erreur de saisie, client a changé d'avis…"></textarea>
    <div id="jmsg"></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" id="jGo">Confirmer</button></div>`);
  $("#jGo").onclick = async () => {
    const par = $("#jPar").value.trim(), motif = $("#jMot").value.trim();
    if (!par || !motif) return msg($("#jmsg"), "Nom et justification obligatoires.");
    try { await envoyer(motif, par); closeModal(); action(); } catch (e) { msg($("#jmsg"), e.message); }
  };
}
async function mettreEnAttente() {
  if (!CART.length) return msg($("#cmsg"), "Le panier est vide.");
  const nom = prompt("Nom ou repère du client (facultatif) :", "");
  if (nom === null) return;
  try { await api("/caisse/attente", { method: "POST", body: { nom, lignes: CART } }); CART = []; renderCart(); msg($("#cmsg"), "Ticket mis en attente.", "ok"); }
  catch (e) { msg($("#cmsg"), e.message); }
}
async function listeAttente() {
  const L = await api("/caisse/attente");
  openModal(`<h2>Tickets en attente</h2>
    <table>${L.map((t, i) => `<tr><td><b>${esc(t.nom || "Sans nom")}</b><div class="muted">${fdate(t.date)} · ${t.lignes.reduce((s, l) => s + l.qte, 0)} art.</div></td><td class="num">${eur(t.lignes.reduce((s, l) => s + l.prix * l.qte, 0))}</td>
      <td class="num"><button class="btn small" data-rep="${i}">Reprendre</button> <button class="btn small ghost" data-sup="${i}">Supprimer</button></td></tr>`).join("") || "<tr><td class='muted'>Aucun ticket en attente.</td></tr>"}</table>
    <button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Fermer</button>`);
  document.querySelectorAll("[data-rep]").forEach((b) => (b.onclick = async () => {
    const t = L[b.dataset.rep];
    if (CART.length && !confirm("Le panier en cours sera remplacé. Continuer ?")) return;
    CART = t.lignes.map((l) => { const p = PRODS.find((x) => x.ref === l.ref); return p ? { ...l, prix: p.prix, nom: p.nom } : l; });
    await api("/caisse/attente/" + t.id, { method: "DELETE" }); closeModal(); renderCart();
  }));
  document.querySelectorAll("[data-sup]").forEach((b) => (b.onclick = () => { const t = L[b.dataset.sup];
    justifier("Supprimer un ticket en attente", { type: "panier", detail: (t.nom || "Ticket en attente") + " : " + t.lignes.map((l) => l.qte + " × " + l.nom).join(", "), montant: t.lignes.reduce((s, l) => s + l.prix * l.qte, 0) },
      async () => { await api("/caisse/attente/" + t.id, { method: "DELETE" }); listeAttente(); }); }));
}

function payer(mode) {
  if (!CART.length) return msg($("#cmsg"), "Le panier est vide.");
  if (!estGerant() && !VENDEUR()) return choisirVendeur(() => payer(mode));
  const P = calcPanier(), total = P.aPayer;
  if (total === 0 && BON) return encaisser(mode, P, {});
  const esp = mode === "Espèces", mix = mode === "Mixte";
  openModal(`
    <h2>Paiement : ${mix ? "carte + espèces" : esc(mode)}</h2>
    <div class="total">${eur(total)}</div>
    ${mix ? `<label>Montant payé par carte (€)</label><input id="pCb" inputmode="decimal" style="font-size:20px"><p class="muted" id="pEspPart"></p>` : ""}
    ${esp || mix ? `<label>Espèces données par le client (€)</label><input id="recu" inputmode="decimal" placeholder="ex. 50" style="font-size:22px">
      <div class="quick" id="quick"></div><div id="rendu" class="rendu hidden"></div>` : ""}
    <div id="pmsg"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="pAnn">Annuler</button><button class="btn" id="pOk">Valider l'encaissement</button></div>`);
  const cents = (id) => Math.round(parseFloat(($("#" + id)?.value || "0").replace(",", ".")) * 100) || 0;
  const partEsp = () => (mix ? Math.max(0, total - cents("pCb")) : total);
  const majRendu = () => {
    const due = partEsp(), r = cents("recu"), el = $("#rendu");
    if (mix) $("#pEspPart").textContent = "Reste à payer en espèces : " + eur(due);
    $("#quick").innerHTML = [[due / 100, "Montant exact"], [10, "10 €"], [20, "20 €"], [50, "50 €"], [100, "100 €"]].filter(([v]) => v * 100 >= due).map(([v, l]) => `<button class="btn small ghost" data-q="${v}">${l}</button>`).join("");
    document.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => { $("#recu").value = String(b.dataset.q).replace(".", ","); majRendu(); }));
    if (!r) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden"); el.classList.toggle("manque", r < due);
    el.textContent = r >= due ? "À rendre : " + eur(r - due) : "Il manque " + eur(due - r);
  };
  if (esp || mix) { $("#recu").oninput = majRendu; if (mix) $("#pCb").oninput = majRendu; majRendu(); setTimeout(() => $(mix ? "#pCb" : "#recu").focus(), 50); }
  $("#pAnn").onclick = closeModal;
  $("#pOk").onclick = async () => {
    if (mix && (cents("pCb") <= 0 || cents("pCb") >= total)) return msg($("#pmsg"), "Indiquez la part payée par carte (inférieure au total).");
    if ((esp || mix) && cents("recu") && cents("recu") < partEsp()) return msg($("#pmsg"), "Les espèces données sont inférieures à ce qui reste à payer.");
    $("#pOk").disabled = true;
    encaisser(mode, P, { recu: $("#recu")?.value || null, cb: mix ? $("#pCb").value : null }, (t) => { msg($("#pmsg"), t); $("#pOk").disabled = false; });
  };
}
async function encaisser(mode, P, extra, onErr = (t) => alert(t)) {
  const corps = { id: crypto.randomUUID(), date: new Date().toISOString(), vendeur: VENDEUR()?.initiales || "",
    lignes: CART.map((l) => (l.cadeau ? { ref: "CADEAU", montant: (l.prix / 100).toFixed(2) } : { ref: l.ref, qte: l.qte, remise: l.remise || null })), remiseTicket: REM_TICKET,
    paiement: { mode, recu: extra.recu || null, cb: extra.cb || null, bon: BON?.code || null } };
  let v;
  try { v = await api("/caisse/ventes", { method: "POST", body: corps }); }
  catch (e) {
    if (!(e instanceof TypeError) && navigator.onLine) return onErr(e.message);
    if (BON || CART.some((l) => l.cadeau)) return onErr("Pas de connexion internet : les bons d'achat et cartes cadeaux ne sont pas disponibles hors connexion.");
    v = venteLocale(corps, P); ajouterFile(corps);
  }
  CART = []; REM_TICKET = null; BON = null; renderCart(); if (!v.horsLigneLocal) loadProds();
  showTicket(v);
}
// ---- Mode hors connexion : les ventes sont gardées sur l'appareil puis envoyées dès le retour d'internet ----
function venteLocale(corps, P) {
  const total = P.total, mode = corps.paiement.mode;
  const toC = (x) => Math.round(parseFloat(String(x || "0").replace(",", ".")) * 100) || 0;
  const paiement = { mode, recu: corps.paiement.recu ? toC(corps.paiement.recu) : null };
  if (mode === "Mixte") { paiement.cb = toC(corps.paiement.cb); paiement.especes = total - paiement.cb; }
  return { id: corps.id, numero: "HL-" + corps.id.slice(0, 6).toUpperCase(), date: corps.date, total, paiement, annulee: false, horsLigneLocal: true, vendeur: VENDEUR(),
    lignes: P.lignes.map((l) => ({ ref: l.ref, nom: l.nom, artisanNom: l.artisanNom, qte: l.qte, pu: l.prix, total: l.total })) };
}
const lireFile = () => JSON.parse(localStorage.getItem("fileVentes") || "[]");
function ajouterFile(corps) { const f = lireFile(); f.push(corps); localStorage.setItem("fileVentes", JSON.stringify(f)); majBandeauHorsLigne(); }
let SYNC_EN_COURS = false;
async function synchroniser() {
  if (SYNC_EN_COURS || !S.cle) return;
  let f = lireFile(); if (!f.length) return majBandeauHorsLigne();
  SYNC_EN_COURS = true;
  try {
    while (f.length) { await api("/caisse/ventes", { method: "POST", body: { ...f[0], sync: true } }); f = lireFile().slice(1); localStorage.setItem("fileVentes", JSON.stringify(f)); }
    if ($("#results")) loadProds();
  } catch {} finally { SYNC_EN_COURS = false; majBandeauHorsLigne(); }
}
function majBandeauHorsLigne() {
  let b = $("#bandeauHL");
  const n = lireFile().length;
  if (!n && navigator.onLine) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement("div"); b.id = "bandeauHL"; b.className = "offline"; document.querySelector("main").prepend(b); }
  b.textContent = (navigator.onLine ? "" : "Pas de connexion internet. ") + (n ? `${n} vente(s) enregistrée(s) sur cet appareil, envoi automatique dès le retour d'internet.` : "Les ventes seront gardées sur cet appareil.");
}
window.addEventListener("online", synchroniser);
window.addEventListener("offline", majBandeauHorsLigne);
setInterval(synchroniser, 30000);

  const s = S.settings;
  return `<div id="ticket">
    <div class="c"><b>${esc(s.nomBoutique)}</b>${s.adresse ? "<br>" + esc(s.adresse) : ""}</div>
    <div class="c">${fdate(v.date)} · Ticket ${esc(v.numero)}</div>
    ${v.vendeur?.nom ? `<div class="c">Vendeur : ${esc(v.vendeur.nom)}</div>` : ""}
    ${v.type === "retour" ? `<div class="c"><b>*** TICKET DE RETOUR ***</b><br>sur le ticket ${esc(v.origine?.numero || "")}</div>` : ""}
    ${v.annulee ? '<div class="c"><b>*** VENTE ANNULÉE ***</b></div>' : ""}
    <hr>
    ${v.lignes.map((l) => `<div>${esc(l.nom)}</div>
      <div class="l"><span>${l.qte} x ${eur(l.pu)}${l.remise ? ` (remise −${esc(l.remise.valeur)}${l.remise.type === "%" ? " %" : " €"})` : ""}</span><span>${eur(l.total)}</span></div>
      <div style="font-size:11px">${l.ref === "CADEAU" ? "Code " + esc(l.code || "attribué à la synchronisation") + " – valable 1 an" : `Réf. ${esc(l.ref)} – ${v.type === "retour" ? "repris" : "vendu"} pour le compte de ${esc(l.artisanNom)}`}</div>`).join("<div style='height:4px'></div>")}
    <hr>
    ${v.remiseTicket ? `<div class="l"><span>Remise sur le ticket (−${esc(v.remiseTicket.valeur)}${v.remiseTicket.type === "%" ? " %" : " €"})</span><span>−${eur(v.remiseTicket.montant)}</span></div>` : ""}
    <div class="l"><b>TOTAL</b><b>${eur(v.total)}</b></div>
    ${v.paiement.bon ? `<div class="l"><span>${v.paiement.bon.type === "avoir" ? "Avoir" : "Carte cadeau"} ${esc(v.paiement.bon.code)}</span><span>${eur(v.paiement.bon.montant)}</span></div>` : ""}
    ${v.paiement.mode === "Avoir émis" ? `<div class="l"><span>Remboursé par avoir ${esc(v.paiement.avoir || "")}</span><span>${eur(-v.total)}</span></div>`
      : v.paiement.mode === "Bon" ? "" : v.type === "retour" ? `<div class="l"><span>Remboursé en ${esc(v.paiement.mode === "CB" ? "carte" : v.paiement.mode)}</span><span>${eur(-v.total)}</span></div>`
      : v.paiement.mode === "Mixte" ? `<div class="l"><span>Carte</span><span>${eur(v.paiement.cb)}</span></div><div class="l"><span>Espèces</span><span>${eur(v.paiement.especes)}</span></div>` : `<div class="l"><span>Payé par ${esc(v.paiement.mode === "CB" ? "carte" : v.paiement.mode)}</span><span>${v.paiement.bon ? eur(v.total - v.paiement.bon.montant) : ""}</span></div>`}
    ${v.paiement.recu ? `<div class="l"><span>Espèces reçues</span><span>${eur(v.paiement.recu)}</span></div><div class="l"><span>Rendu</span><span>${eur(renduDe(v))}</span></div>` : ""}
    ${v.horsLigneLocal ? `<div class="c" style="font-size:11px">Ticket enregistré hors connexion</div>` : `<div class="c" style="margin-top:6px"><div style="width:60mm;height:12mm;margin:0 auto">${barcodeSVG(v.numero)}</div><div style="font-size:10px">Gardez ce ticket pour tout échange</div></div>`}
    <hr>
    <div class="c" style="font-size:11px">Articles vendus au nom et pour le compte des artisans et producteurs indiqués.<br>Merci de votre visite !</div>
  </div>`;
}
const renduDe = (v) => v.paiement.recu - (v.paiement.mode === "Mixte" ? v.paiement.especes : v.total - (v.paiement.bon?.montant || 0));
function showTicket(v) {
  const exp = (d) => { const x = new Date(d); x.setFullYear(x.getFullYear() + 1); return ymd(x); };
  const cartes = v.lignes.filter((l) => l.ref === "CADEAU" && l.code).map((l) => bonHTML({ code: l.code, type: "carte cadeau", solde: l.total, expire: exp(v.date) })).join("");
  openModal(`${v.paiement.recu && !v.annulee ? `<div class="rendu" style="margin-bottom:12px">À rendre : ${eur(renduDe(v))}</div>` : ""}${ticketHTML(v)}${cartes}<div class="row" style="margin-top:14px"><button class="btn ghost" id="tClose">Fermer</button><button class="btn" id="tPrint">Imprimer le ticket</button></div>`);
  $("#tClose").onclick = () => { closeModal(); $("#scan")?.focus(); };
  $("#tPrint").onclick = () => { $("#modal").classList.add("print-zone"); window.print(); $("#modal").classList.remove("print-zone"); };
}
// ================== PERSONNE EN CAISSE ==================
// L'artisan d'accueil s'identifie par ses initiales ; on redemande à chaque demi-journée.
const cleCreneau = () => { const d = new Date(); return ymd(d) + (d.getHours() < 14 ? "-matin" : "-aprem"); };
function VENDEUR() {
  if (estGerant()) return { initiales: "GÉR", nom: "Gérance" };
  try { const v = JSON.parse(localStorage.getItem("vendeurCaisse") || "null"); return v && v.cle === cleCreneau() ? v : null; } catch { return null; }
}
function afficherVendeur() {
  const el = $("#cVendeur"); if (!el) return;
  const v = VENDEUR();
  el.innerHTML = `<div class="row" style="align-items:center;margin:6px 0"><span>En caisse : <b>${v ? esc(v.nom) + (estGerant() ? "" : " (" + esc(v.initiales) + ")") : '<span style="color:var(--rouge)">personne</span>'}</b></span>${estGerant() ? "" : `<button class="btn small ghost" id="cChgV" style="flex:0 0 auto">${v ? "Changer" : "Je prends la caisse"}</button>`}</div>`;
  if ($("#cChgV")) $("#cChgV").onclick = () => choisirVendeur();
}
function choisirVendeur(ensuite) {
  openModal(`<h2>Qui est en caisse ?</h2><p class="muted">Tapez vos initiales. Elles apparaîtront sur les tickets et le ticket Z.</p>
    <input id="vIni" maxlength="4" style="text-transform:uppercase;font-size:22px" autofocus><div id="vmsg"></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="vGo">Valider</button></div>`);
  const go = async () => {
    try { const a = await api("/caisse/vendeur?initiales=" + encodeURIComponent($("#vIni").value.trim()));
      localStorage.setItem("vendeurCaisse", JSON.stringify({ ...a, cle: cleCreneau() })); closeModal(); afficherVendeur(); ensuite && ensuite(); }
    catch (e) { msg($("#vmsg"), e.message); }
  };
  $("#vGo").onclick = go; $("#vIni").onkeydown = (e) => { if (e.key === "Enter") go(); };
  setTimeout(() => $("#vIni")?.focus(), 50);
}

// ================== RETOURS, ÉCHANGES, BONS D'ACHAT ==================
function retourClient() {
  openModal(`<h2>Retour / échange</h2><p class="muted">Scannez le code-barres du ticket du client, ou tapez son numéro.</p>
    <input id="rNum" placeholder="ex. 20270115-12345" style="font-size:18px" autofocus><div id="rmsg"></div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Fermer</button><button class="btn" id="rFind">Rechercher le ticket</button></div>`);
  const find = async () => {
    try { const v = await api("/caisse/ticket?numero=" + encodeURIComponent($("#rNum").value.trim())); retourLignes(v); }
    catch (e) { msg($("#rmsg"), e.message); }
  };
  $("#rFind").onclick = find; $("#rNum").onkeydown = (e) => { if (e.key === "Enter") find(); };
  setTimeout(() => $("#rNum")?.focus(), 50);
}
function retourLignes(v) {
  if (v.annulee) return msg($("#rmsg"), "Ce ticket est annulé.");
  if (v.type === "retour") return msg($("#rmsg"), "C'est un ticket de retour.");
  const dispo = (l) => (l.ref === "CADEAU" || l.artisanId === "boutique" ? 0 : l.qte - (l.retourne || 0));
  openModal(`<h2>Retour sur le ticket ${esc(v.numero)}</h2><p class="muted">Vendu le ${fdate(v.date)} · ${eur(v.total)}</p>
    <table>${v.lignes.map((l, i) => `<tr><td>${esc(l.nom)}<div class="muted">${esc(l.artisanNom)} · ${l.qte} × ${eur(l.total / l.qte)}${l.retourne ? ` · déjà repris : ${l.retourne}` : ""}</div></td>
      <td style="width:80px">${dispo(l) > 0 ? `<input type="number" min="0" max="${dispo(l)}" value="0" data-rq="${i}">` : '<span class="muted">—</span>'}</td></tr>`).join("")}</table>

const COUPURES = [500, 200, 100, 50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];
const coupLabel = (v) => v >= 5 ? `Billet ${v} €` : v >= 1 ? `Pièce ${v} €` : `Pièce ${Math.round(v * 100)} c`;
let SESSION = null;
function comptageHTML(id, init = {}) {
  return `<div id="${id}">${COUPURES.map((v) => `<div class="row" style="align-items:center;margin-bottom:4px;gap:6px">
    <span style="min-width:110px;flex:0 0 auto">${coupLabel(v)}</span>
    <span class="qty" style="flex:0 0 auto"><button type="button" data-m="-1">−</button><input data-v="${v}" type="number" min="0" value="${init[v] || 0}" style="width:64px;text-align:center;padding:6px"><button type="button" data-m="1">+</button></span>
    <span class="muted" data-st="${v}" style="text-align:right">${eur(Math.round(v * 100) * (init[v] || 0))}</span></div>`).join("")}
    <div class="total" data-tot>0,00 €</div></div>`;
}
function bindComptage(id, onChange) {
  const root = $("#" + id);
  const read = () => { const c = {}; root.querySelectorAll("[data-v]").forEach((i) => { const n = parseInt(i.value, 10) || 0; if (n) c[i.dataset.v] = n; }); return c; };
  const upd = () => {
    let t = 0;
    root.querySelectorAll("[data-v]").forEach((i) => { const st = Math.round(Number(i.dataset.v) * 100) * (parseInt(i.value, 10) || 0); t += st; root.querySelector(`[data-st="${i.dataset.v}"]`).textContent = eur(st); });
    root.querySelector("[data-tot]").textContent = "Total compté : " + eur(t);
    onChange && onChange(t, read());
  };
  root.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { const i = b.parentElement.querySelector("input"); i.value = Math.max(0, (parseInt(i.value, 10) || 0) + Number(b.dataset.m)); upd(); }));
  root.querySelectorAll("[data-v]").forEach((i) => (i.oninput = upd));
  upd();
  return read;
}
async function loadSession() {
  try { SESSION = await api("/caisse/session"); } catch { return; }
  const el = $("#cSession"); if (!el) return;
  if (SESSION.z) el.innerHTML = `<div class="msg ok">Caisse clôturée aujourd'hui à ${new Date(SESSION.z.heure).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}. <button class="btn small ghost" id="reZ">Réimprimer le Z</button></div>`;
  else if (!SESSION.ouverture) el.innerHTML = `<div class="msg err">Fond de caisse du matin non validé. <button class="btn small osb" id="goOuv">Ouvrir la caisse et compter le fond</button></div>`;

function exporterCompta(du, au) {
  api(`/export?du=${du}&au=${au}`).then((V) => {
    const n = (c) => ((c || 0) / 100).toFixed(2).replace(".", ",");
    const rows = [["Date", "Heure", "Ticket", "Type", "Statut", "Personne en caisse", "Paiement", "Part CB", "Part espèces", "Part bon/avoir", "Code bon", "Artisan", "Référence", "Article", "Quantité", "Prix unitaire", "Remise", "Total ligne"]];
    for (const v of V) {
      const p = v.paiement, bon = p.bon?.montant || 0, reste = v.total - bon;
      const d = new Date(v.date), cb = p.mode === "Mixte" ? p.cb : p.mode === "CB" ? reste : 0, es = p.mode === "Mixte" ? p.especes : p.mode === "Espèces" ? reste : 0;
      for (const l of v.lignes) rows.push([d.toLocaleDateString("fr-FR"), d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }), v.numero, v.type === "retour" ? "Retour" : l.ref === "CADEAU" ? "Carte cadeau" : "Vente", v.annulee ? "Annulée" : "Valide", v.vendeur?.nom || "", p.mode, n(cb), n(es), n(p.mode === "Avoir émis" ? v.total : bon), p.bon?.code || p.avoir || l.code || "", l.artisanNom, l.ref, l.nom, l.qte, n(l.pu), n((l.remise?.montant || 0) + (l.remiseTicket || 0)), n(l.total)]);
    }
    const csv = "﻿" + rows.map((r) => r.map((x) => `"${String(x).replace(/"/g, '""')}"`).join(";")).join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" })); a.download = `export-ventes-${du}-au-${au}.csv`; a.click();
  }).catch((e) => alert(e.message));
}

function barcodeSVG(code) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  try { JsBarcode(svg, code, { format: "CODE128", displayValue: false, margin: 0, height: 40, width: 2 }); } catch {}
  svg.setAttribute("preserveAspectRatio", "none");
  return svg.outerHTML;
}

// ---- Périodes (heure locale) ----
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function periodeDates(k) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  if (k === "jour") return [ymd(n), ymd(n)];
  if (k === "semaine") { const l = new Date(n); l.setDate(n.getDate() - ((n.getDay() + 6) % 7)); const f = new Date(l); f.setDate(l.getDate() + 6); return [ymd(l), ymd(f)]; }
  if (k === "mois") return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];
  if (k === "trimestre") { const q = Math.floor(m / 3) * 3; return [ymd(new Date(y, q, 1)), ymd(new Date(y, q + 3, 0))]; }
}
function periodPicker(onChange, initial = "mois") {
  const libs = [["jour", "Aujourd'hui"], ["semaine", "Cette semaine"], ["mois", "Ce mois-ci"], ["trimestre", "Ce trimestre"], ["perso", "Dates au choix"]];
  const html = `<div class="card"><div class="periods" id="per">${libs.map(([k, l]) => `<button class="btn small ghost ${k === initial ? "on" : ""}" data-p="${k}">${l}</button>`).join("")}</div>
    <div class="row hidden" id="perso" style="margin-top:10px"><div><label>Du</label><input type="date" id="pDu"></div><div><label>Au</label><input type="date" id="pAu"></div><div style="flex:0 0 auto"><button class="btn" id="pGo">Afficher</button></div></div></div>`;
  const bind = () => {
    document.querySelectorAll("#per [data-p]").forEach((b) => (b.onclick = () => {
      document.querySelectorAll("#per [data-p]").forEach((x) => x.classList.toggle("on", x === b));
      $("#perso").classList.toggle("hidden", b.dataset.p !== "perso");
      if (b.dataset.p !== "perso") onChange(...periodeDates(b.dataset.p));
    }));
    $("#pGo").onclick = () => $("#pDu").value && $("#pAu").value && onChange($("#pDu").value, $("#pAu").value);
    onChange(...periodeDates(initial));
  };
  return { html, bind };
}
const fd = (d) => new Date(d + "T12:00:00").toLocaleDateString("fr-FR");
function barres(data, val, lbl) {
  if (!data.length) return `<p class="muted">Pas de données.</p>`;
  const max = Math.max(...data.map(val), 1);
  return `<div class="bars">${data.map((d) => `<div style="height:${Math.round((val(d) / max) * 100)}%" title="${esc(lbl(d))} : ${eur(val(d))}"></div>`).join("")}</div>
    <div class="barlbl">${data.map((d) => `<span>${esc(lbl(d))}</span>`).join("")}</div>`;
}

      <div id="mmsg"></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="mGo">Enregistrer</button></div>`);
    document.querySelectorAll("[data-q]").forEach((x) => (x.oninput = () => (L[x.dataset.q].qte = x.value)));

    $("#mAddGo").onclick = () => { const r = $("#mAdd").value.trim().toUpperCase(); if (r) { L.push({ ref: r, nom: r, artisanNom: "", qte: 1, pu: "" }); draw(); } };

      <p class="muted">Les références de ses articles commenceront par ses initiales (ex. MD001).</p></div>
    <div class="card"><h2>Artisans</h2><div id="alist"></div></div></div>`;
  const load = async () => {
    const A = await api("/artisans");
    const cats = {}; A.filter((a) => a.actif && a.categorie).forEach((a) => (cats[a.categorie] = (cats[a.categorie] || 0) + 1));
    $("#catList").innerHTML = Object.keys(cats).map((c) => `<option value="${esc(c)}">`).join("");
    $("#alist").innerHTML = (Object.keys(cats).length ? `<p class="muted">Par catégorie : ${Object.entries(cats).map(([c, n]) => `<span class="tag ${n >= 4 ? "off" : ""}">${esc(c)} ${n}/4</span>`).join(" ")}</p>` : "") + `<table><tr><th>Artisan</th><th>Identifiant</th><th>Stand</th><th>Contrat</th><th></th></tr>
      ${A.map((a) => `<tr><td><b>${esc(a.initiales)}</b> ${esc(a.nom)}<div class="muted">${a.categorie ? esc(a.categorie) + " · " : ""}${esc(a.metier)} ${esc(a.telephone)}</div>${a.actif ? "" : '<span class="tag off">désactivé</span>'}</td><td>${esc(a.identifiant)}</td><td>${esc(a.stand)}<div class="muted">${a.formule === "sans accueil" ? "Sans accueil" + (a.formuleDepuis ? " dès le " + fd(a.formuleDepuis) : "") : "Avec accueil"}</div><button class="btn small ghost" data-form="${a.id}" data-v="${a.formule === "sans accueil" ? "avec accueil" : "sans accueil"}">${a.formule === "sans accueil" ? "Repasser avec accueil" : "Passer sans accueil"}</button></td><td>${a.dateDebut ? "Début : " + new Date(a.dateDebut + "T12:00:00").toLocaleDateString("fr-FR") + `<div class="muted">Engagement jusqu'au ${finEngagement(a.dateDebut)}</div>` : `<span class="muted">non renseigné</span>`}<div><button class="btn small ghost" data-deb="${a.id}" data-v="${esc(a.dateDebut || "")}">Modifier la date</button></div></td>
      <td class="num"><button class="btn small osb" data-rel="${a.id}">Relevé / facture</button> <button class="btn small ghost" data-pw="${a.id}">Nouveau mot de passe</button> <button class="btn small ${a.actif ? "ghost" : ""}" data-act="${a.id}" data-v="${a.actif ? 0 : 1}">${a.actif ? "Désactiver" : "Réactiver"}</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Aucun artisan.</td></tr>`}</table>`;
    $("#alist").querySelectorAll("[data-pw]").forEach((b) => (b.onclick = async () => {
      const pw = prompt("Nouveau mot de passe (6 caractères min.) :"); if (!pw) return;
      try { await api("/artisans/" + b.dataset.pw, { method: "PUT", body: { motdepasse: pw } }); alert("Mot de passe modifié."); } catch (e) { alert(e.message); }
    }));
    $("#alist").querySelectorAll("[data-form]").forEach((b) => (b.onclick = async () => { await api("/artisans/" + b.dataset.form, { method: "PUT", body: { formule: b.dataset.v, formuleDepuis: "" } }); load(); }));
    $("#alist").querySelectorAll("[data-rel]").forEach((b) => (b.onclick = () => {
      const m = prompt("Mois du relevé (AAAA-MM) :", thisMonth()); if (!m) return;
      imprimerReleve(m, b.dataset.rel).catch((e) => alert(e.message));
    }));
    $("#alist").querySelectorAll("[data-deb]").forEach((b) => (b.onclick = async () => {
      const d = prompt("Date de début du contrat (format AAAA-MM-JJ, ex. 2027-01-05) :", b.dataset.v); if (d === null) return;
      if (d && !/^\d{4}-\d{2}-\d{2}$/.test(d)) return alert("Format attendu : AAAA-MM-JJ");
      await api("/artisans/" + b.dataset.deb, { method: "PUT", body: { dateDebut: d } }); load();
    }));
    $("#alist").querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => { await api("/artisans/" + b.dataset.act, { method: "PUT", body: { actif: b.dataset.v === "1" } }); load(); }));
  };
  $("#aGo").onclick = async () => {
    try {
      const a = await api("/artisans", { method: "POST", body: { nom: $("#aNom").value, initiales: $("#aIni").value, identifiant: $("#aId").value, motdepasse: $("#aPw").value, metier: $("#aMet").value, stand: $("#aStand").value, categorie: $("#aCat").value, dateDebut: $("#aDeb").value, formule: $("#aForm").value, telephone: $("#aTel").value, email: $("#aMail").value } });
      msg($("#amsg"), `Compte créé : identifiant « ${a.identifiant} », initiales ${a.initiales}.`, "ok");
      ["aNom", "aIni", "aId", "aPw", "aMet", "aCat", "aTel", "aMail", "aDeb"].forEach((i) => ($("#" + i).value = "")); load();
    } catch (e) {
      if (/4 maximum/.test(e.message) && confirm(e.message + "\n\nCréer le compte quand même ?")) {
        try { await api("/artisans", { method: "POST", body: { nom: $("#aNom").value, initiales: $("#aIni").value, identifiant: $("#aId").value, motdepasse: $("#aPw").value, metier: $("#aMet").value, stand: $("#aStand").value, categorie: $("#aCat").value, dateDebut: $("#aDeb").value, formule: $("#aForm").value, telephone: $("#aTel").value, email: $("#aMail").value, forcer: true } }); msg($("#amsg"), "Compte créé.", "ok"); load(); } catch (x) { msg($("#amsg"), x.message); }
      } else msg($("#amsg"), e.message);
    }
  };
  load();
}

// ================== LOYERS, REVERSEMENTS, INVENTAIRES, BONS ==================
async function adminSuivi() {
  app.innerHTML = `<div id="suAl"></div>
    <div class="card"><h2>Loyers payés d'avance</h2><p class="muted">Le loyer est réglé 3 mois à l'avance. En rouge : la période payée se termine dans moins de 15 jours ou est dépassée.</p><div id="suLoy"></div></div>
    <div class="card"><div class="row" style="align-items:flex-end"><h2 style="margin:0">Reversements aux artisans</h2><div style="max-width:200px"><label>Mois des ventes</label><input type="month" id="suM"></div></div><div id="suRev" style="margin-top:10px"></div></div>
    <div class="card"><h2>Inventaires et démarque</h2><div class="row"><div><label>Faire l'inventaire d'un artisan</label><select id="suInvA"></select></div><div style="flex:0 0 auto"><button class="btn ghost" id="suInvGo">Commencer</button></div></div><div id="suInv" style="margin-top:10px"></div></div>
    <div class="card"><h2>Bons d'achat, avoirs et cartes cadeaux</h2><div id="suBon"></div></div>`;
  const auj = ymd(new Date()), d15 = ymd(new Date(Date.now() + 15 * 864e5));
  const m0 = new Date(); m0.setMonth(m0.getMonth() - 1); $("#suM").value = ymd(m0).slice(0, 7);
  api("/alertes").then((a) => ($("#suAl").innerHTML = alertesHTML(a, true))).catch(() => {});
  const loyers = async () => {
    const L = await api("/loyers");
    $("#suLoy").innerHTML = `<table><tr><th>Artisan</th><th>Stand</th><th>Payé jusqu'au</th><th>Paiements</th><th></th></tr>${L.map((a) => {
      const alerte = !a.couvertJusquau || a.couvertJusquau < d15;
      return `<tr><td><b>${esc(a.initiales)}</b> ${esc(a.nom)}</td><td>${esc(a.stand)} · ${eur(a.loyer)}/mois${a.formule === "sans accueil" ? '<div class="muted">+ supplément sans accueil sur relevé</div>' : ""}</td>
        <td style="color:${alerte ? "var(--rouge)" : "inherit"};font-weight:600">${a.couvertJusquau ? fd(a.couvertJusquau) : "aucun paiement"}</td>
        <td>${a.paiements.map((x) => `<div class="muted">${eur(x.montant)} · ${fd(x.du)} → ${fd(x.au)} · ${esc(x.mode)}${x.note ? " · " + esc(x.note) : ""} <button class="btn small ghost" style="padding:0 6px" data-ldel="${a.artisanId}|${x.id}">✕</button></div>`).join("") || '<span class="muted">—</span>'}</td>
        <td class="num"><button class="btn small" data-lp="${a.artisanId}">Enregistrer un paiement</button></td></tr>`; }).join("") || "<tr><td class='muted'>Aucun artisan.</td></tr>"}</table>`;
    $("#suLoy").querySelectorAll("[data-ldel]").forEach((b) => (b.onclick = async () => { if (!confirm("Supprimer ce paiement ?")) return; const [a, id] = b.dataset.ldel.split("|"); await api(`/loyers/${a}/${id}`, { method: "DELETE" }); loyers(); }));
    $("#suLoy").querySelectorAll("[data-lp]").forEach((b) => (b.onclick = () => {
      const a = L.find((x) => x.artisanId === b.dataset.lp);
      const du = a.couvertJusquau ? ymd(new Date(new Date(a.couvertJusquau + "T12:00:00").getTime() + 864e5)) : a.dateDebut || auj;
      const au = (() => { const d = new Date(du + "T12:00:00"); d.setMonth(d.getMonth() + 3); d.setDate(d.getDate() - 1); return ymd(d); })();
      openModal(`<h2>Loyer – ${esc(a.nom)}</h2><div class="row"><div><label>Montant (€)</label><input id="lMt" inputmode="decimal" value="${((a.loyer * 3 + (a.paiements.length ? 0 : S.settings.fraisInstallation ?? 5000)) / 100).toFixed(2).replace(".", ",")}"></div><div><label>Mode</label><select id="lMo"><option>Virement</option><option>Carte</option><option>Espèces</option><option>Chèque</option></select></div></div>
        <div class="row"><div><label>Du</label><input type="date" id="lDu" value="${du}"></div><div><label>Au</label><input type="date" id="lAu" value="${au}"></div></div>
        <label>Note</label><input id="lNo" value="${a.paiements.length ? "" : "dont " + eur(S.settings.fraisInstallation ?? 5000) + " de frais d'installation"}"><div id="lmsg"></div>
        <div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="lGo">Enregistrer</button></div>`);
      $("#lGo").onclick = async () => { try { await api("/loyers", { method: "POST", body: { artisanId: a.artisanId, montant: $("#lMt").value, mode: $("#lMo").value, du: $("#lDu").value, au: $("#lAu").value, note: $("#lNo").value } }); closeModal(); loyers(); } catch (e) { msg($("#lmsg"), e.message); } };
    }));
  };
  const reversements = async () => {
    const mois = $("#suM").value, R = await api("/reversements?mois=" + mois);
    $("#suRev").innerHTML = `<table><tr><th>Artisan</th><th class="num">Ventes</th><th class="num">Facture</th><th class="num">À reverser</th><th>Virement</th><th></th></tr>${R.map((r) => `<tr><td><b>${esc(r.initiales)}</b> ${esc(r.nom)}</td><td class="num">${eur(r.ca)}</td><td class="num">${eur(r.commission + r.supplement)}${r.report ? `<div class="muted">+ report ${eur(r.report)}</div>` : ""}</td>
      <td class="num"><b style="color:${r.aReverser < 0 ? "var(--rouge)" : "inherit"}">${r.aReverser < 0 ? "Reste dû " + eur(-r.aReverser) : eur(r.aReverser)}</b></td>
      <td>${r.fait ? `<span class="tag">Payé le ${fd(r.fait.date)} · ${eur(r.fait.montant)}</span>` : r.aReverser > 0 ? '<span class="tag off">à faire</span>' : '<span class="muted">rien à verser</span>'}</td>
      <td class="num"><button class="btn small osb" data-rr="${r.artisanId}">Relevé</button> ${r.fait ? `<button class="btn small ghost" data-rx="${r.artisanId}">Annuler</button>` : r.aReverser > 0 ? `<button class="btn small" data-rp="${r.artisanId}" data-v="${r.aReverser}">Marquer payé</button>` : ""}</td></tr>`).join("") || "<tr><td class='muted'>Aucun artisan.</td></tr>"}
      <tr><td><b>Total</b></td><td class="num"><b>${eur(R.reduce((t, r) => t + r.ca, 0))}</b></td><td></td><td class="num"><b>${eur(R.reduce((t, r) => t + Math.max(0, r.aReverser), 0))}</b></td><td colspan="2"></td></tr></table>`;
    $("#suRev").querySelectorAll("[data-rr]").forEach((b) => (b.onclick = () => imprimerReleve(mois, b.dataset.rr).catch((e) => alert(e.message))));
    $("#suRev").querySelectorAll("[data-rx]").forEach((b) => (b.onclick = async () => { await api("/reversements", { method: "POST", body: { mois, artisanId: b.dataset.rx, annuler: true } }); reversements(); }));
    $("#suRev").querySelectorAll("[data-rp]").forEach((b) => (b.onclick = async () => {
      const d = prompt("Date du virement (AAAA-MM-JJ) :", auj); if (!d) return;
      await api("/reversements", { method: "POST", body: { mois, artisanId: b.dataset.rp, montant: (b.dataset.v / 100).toFixed(2), date: d } }); reversements();
    }));
  };
  const inventaires = async () => {
    const I = await api("/inventaires");
    $("#suInv").innerHTML = `<table><tr><th>Date</th><th>Artisan</th><th>Par</th><th class="num">Articles comptés</th><th class="num">Manquants</th><th class="num">Valeur manquante</th></tr>${I.map((i) => `<tr><td>${fdate(i.date)}</td><td>${esc(i.artisanNom)}</td><td>${esc(i.par)}</td><td class="num">${i.lignes.length}</td><td class="num">${i.manquants}</td><td class="num" style="color:${i.demarque ? "var(--rouge)" : "inherit"}">${eur(i.demarque)}</td></tr>`).join("") || "<tr><td class='muted'>Aucun inventaire pour l'instant.</td></tr>"}
      <tr><td colspan="5"><b>Total démarque</b></td><td class="num"><b>${eur(I.reduce((t, i) => t + i.demarque, 0))}</b></td></tr></table>`;
  };
  const bons = async () => {
    const B = await api("/bons");
    const actifs = B.filter((b) => !b.annule && b.solde > 0 && b.expire >= auj);
    $("#suBon").innerHTML = `<p>En circulation : <b>${eur(actifs.reduce((t, b) => t + b.solde, 0))}</b> (${actifs.length} bons non utilisés). C'est de l'argent dû aux clients jusqu'à l'utilisation.</p>
      <table><tr><th>Code</th><th>Type</th><th>Émis le</th><th class="num">Montant</th><th class="num">Reste</th><th>Valable jusqu'au</th></tr>${B.map((b) => `<tr><td><b>${esc(b.code)}</b></td><td>${b.type === "avoir" ? "Avoir" : "Carte cadeau"}${b.annule ? ' <span class="tag off">annulé</span>' : ""}</td><td>${fdate(b.creeLe)}</td><td class="num">${eur(b.montant)}</td><td class="num">${eur(b.solde)}</td><td style="color:${b.expire < auj ? "var(--rouge)" : "inherit"}">${fd(b.expire)}</td></tr>`).join("") || "<tr><td class='muted'>Aucun bon.</td></tr>"}</table>`;
  };
  const A = await api("/artisans");
  $("#suInvA").innerHTML = A.filter((a) => a.actif).map((a) => `<option value="${a.id}">${esc(a.initiales)} – ${esc(a.nom)}</option>`).join("");
  $("#suInvGo").onclick = async () => { const id = $("#suInvA").value; if (!id) return; const P = (await api("/produits")).filter((p) => p.artisanId === id && p.actif !== false); faireInventaire(P, id, inventaires); };
  $("#suM").onchange = reversements;
  loyers(); reversements(); inventaires(); bons();
}

async function adminProduits() {
  app.innerHTML = `<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Catalogue complet</h2><button class="btn small osb" id="admEtiq" style="flex:0 0 auto">Imprimer des étiquettes</button></div><input id="q" style="margin-top:10px" placeholder="Rechercher un article, une référence, un artisan"><div id="pl" style="margin-top:10px"></div></div>`;
  const [P, A] = await Promise.all([api("/produits"), api("/artisans")]);
  const noms = Object.fromEntries(A.map((a) => [a.id, a.nom]));
  const render = () => {
    const q = $("#q").value.toLowerCase();
    const list = P.filter((p) => !q || p.nom.toLowerCase().includes(q) || p.ref.toLowerCase().includes(q) || (noms[p.artisanId] || "").toLowerCase().includes(q));
    $("#pl").innerHTML = `<table><tr><th>Réf.</th><th>Article</th><th>Artisan</th><th class="num">Prix</th><th class="num">Stock</th></tr>
      ${list.map((p) => `<tr><td><b>${esc(p.ref)}</b></td><td>${esc(p.nom)}${p.actif === false ? ' <span class="tag off">retiré</span>' : ""}</td><td>${esc(noms[p.artisanId])}</td><td class="num">${eur(p.prix)}</td><td class="num">${p.stock ?? "–"}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">Aucun article.</td></tr>`}</table>`;
  };
  $("#q").oninput = render; render();
  $("#admEtiq").onclick = () => printLabels(P.filter((p) => p.actif !== false).map((p) => ({ ...p, artisanNom: noms[p.artisanId] })));
}

async function adminParametres() {
  const s = await api("/settings");
  const postes = await api("/postes");
  app.innerHTML = `<div class="grid2">
    <div class="card"><h2>Boutique</h2>
      <label>Nom de la boutique (affiché sur les tickets)</label><input id="sNom" value="${esc(s.nomBoutique)}">
      <label>Adresse (ticket)</label><input id="sAdr" value="${esc(s.adresse)}">
      <label>Commission de la boutique (%)</label><input id="sCom" type="number" value="${s.commission}">
      <label>SIRET (relevés et factures)</label><input id="sSiret" value="${esc(s.siret || "")}">
      <label>Mention TVA sur les factures</label><input id="sTva" value="${esc(s.mentionTVA || "")}">
      <div class="row"><div><label>Loyer stand 1 m (€)</label><input id="sP1" inputmode="decimal" value="${(s.prixStand1 / 100).toFixed(2).replace(".", ",")}"></div><div><label>Loyer stand 2 m (€)</label><input id="sP2" inputmode="decimal" value="${(s.prixStand2 / 100).toFixed(2).replace(".", ",")}"></div></div>
      <label>Supplément mensuel formule sans participation à l'accueil (€)</label><input id="sPen" inputmode="decimal" value="${((s.supplementSansAccueil ?? 5000) / 100).toFixed(2).replace(".", ",")}">
      <label>Frais d'installation, payés une fois à l'arrivée (€)</label><input id="sInst" inputmode="decimal" value="${((s.fraisInstallation ?? 5000) / 100).toFixed(2).replace(".", ",")}">
      <label>Fond de caisse laissé dans le tiroir (€)</label><input id="sFond" inputmode="decimal" value="${(s.fondReserve / 100).toFixed(2).replace(".", ",")}">
      <div id="smsg"></div><button class="btn" id="sGo" style="margin-top:10px">Enregistrer</button></div>
    <div class="card"><h2>Poste caisse</h2>
      <p class="muted">L'encaissement ne fonctionne que sur un poste activé. Activez uniquement l'ordinateur ou la tablette de la boutique.</p>
      <p>Ce poste : ${S.cle ? '<span class="tag">activé comme caisse</span>' : '<span class="tag off">non activé</span>'}</p>
      ${S.cle ? `<button class="btn ghost" id="desact">Désactiver ce poste</button>` : `<label>Nom du poste</label><input id="pNom" value="Caisse boutique"><button class="btn osb" id="act" style="margin-top:10px">Activer ce poste comme caisse</button>`}
      <h3>Postes activés</h3>
      <table>${postes.filter((p) => !p.revoque).map((p) => `<tr><td>${esc(p.nom)}<div class="muted">depuis le ${fdate(p.creeLe)}</div></td><td class="num"><button class="btn small danger" data-rev="${p.id}">Révoquer</button></td></tr>`).join("") || "<tr><td class='muted'>Aucun poste.</td></tr>"}</table>
    </div>
    <div class="card"><h2>Mot de passe gérance</h2><label>Nouveau mot de passe</label><input type="password" id="apw"><div id="apm"></div><button class="btn" id="apgo" style="margin-top:10px">Changer</button></div></div>`;
  $("#sGo").onclick = async () => {
    try { S.settings = await api("/settings", { method: "PUT", body: { nomBoutique: $("#sNom").value, adresse: $("#sAdr").value, commission: $("#sCom").value, fondReserve: $("#sFond").value, siret: $("#sSiret").value, mentionTVA: $("#sTva").value, prixStand1: $("#sP1").value, prixStand2: $("#sP2").value, supplementSansAccueil: $("#sPen").value, fraisInstallation: $("#sInst").value } }); $("#titre").textContent = S.settings.nomBoutique; msg($("#smsg"), "Enregistré.", "ok"); }
    catch (e) { msg($("#smsg"), e.message); }
  };
  if ($("#act")) $("#act").onclick = async () => {
    const d = await api("/postes", { method: "POST", body: { nom: $("#pNom").value } });
    localStorage.setItem("cleCaisse", d.cle); S.cle = d.cle; adminParametres();
  };
  if ($("#desact")) $("#desact").onclick = () => { localStorage.removeItem("cleCaisse"); S.cle = null; adminParametres(); };
  document.querySelectorAll("[data-rev]").forEach((b) => (b.onclick = async () => { if (!confirm("Révoquer ce poste caisse ?")) return; await api("/postes/" + b.dataset.rev, { method: "DELETE" }); adminParametres(); }));
  $("#apgo").onclick = async () => {
    try { await api("/motdepasse", { method: "POST", body: { nouveau: $("#apw").value } }); msg($("#apm"), "Mot de passe modifié.", "ok"); } catch (e) { msg($("#apm"), e.message); }
  };
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
start();
synchroniser();
</script>
</body>
</html>
