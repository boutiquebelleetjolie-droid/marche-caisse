<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caisse – Marché des Artisans et Producteurs</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<style>
  :root{--bg:#f7f3ec;--card:#fff;--ink:#2d2a26;--muted:#7a7268;--osb:#c99a5b;--osb-d:#9a6f37;--sauge:#6f8f72;--sauge-d:#4f6d52;--rouge:#b5483b;--line:#e6dfd3;--r:12px}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
  header{background:var(--ink);color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .who{font-size:13px;opacity:.85}
  nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:#ece5d8;border-bottom:1px solid var(--line)}
  nav button{background:transparent;border:1px solid transparent;padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer;color:var(--ink)}
  nav button.on{background:#fff;border-color:var(--line);font-weight:600}
  main{padding:16px;max-width:1200px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
  h2{font-size:18px;margin:0 0 12px}
  h3{font-size:15px;margin:14px 0 8px}
  label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
  input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink)}
  textarea{min-height:60px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;cursor:pointer;background:var(--sauge);color:#fff}
  .btn:hover{background:var(--sauge-d)}
  .btn.osb{background:var(--osb)} .btn.osb:hover{background:var(--osb-d)}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.danger{background:var(--rouge)}
  .btn.small{padding:6px 10px;font-size:13px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
  .row>*{flex:1;min-width:140px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:14px}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.03em}
  td.num,th.num{text-align:right;white-space:nowrap}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
  .kpi .l{font-size:12px;color:var(--muted)} .kpi .v{font-size:22px;font-weight:700;margin-top:4px}
  .muted{color:var(--muted);font-size:13px}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;background:#efe7da}
  .tag.off{background:#f3d9d5;color:var(--rouge)}
  .login{max-width:380px;margin:40px auto}
  .msg{padding:10px 12px;border-radius:10px;margin:10px 0;font-size:14px}
  .msg.err{background:#f8e1dd;color:#8a2e23} .msg.ok{background:#e2efe3;color:#2f5b33}
  /* Caisse */
  .caisse{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
  @media(max-width:900px){.caisse{grid-template-columns:1fr}}
  .scan{font-size:20px;padding:14px;border:2px solid var(--osb)}
  .results{max-height:52vh;overflow:auto;margin-top:10px}
  .prod{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:#fff}
  .prod:hover{border-color:var(--osb)}
  .prod b{display:block}
  .cart-line{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
  .qty{display:flex;align-items:center;gap:4px}
  .qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;font-size:16px;cursor:pointer}
  .total{font-size:30px;font-weight:800;text-align:right;margin:12px 0}
  .pay{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .rendu{font-size:26px;font-weight:800;text-align:center;padding:12px;border-radius:10px;background:#e2efe3;color:#2f5b33;margin-top:10px}
  .rendu.manque{background:#f8e1dd;color:#8a2e23}
  .quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .bars{display:flex;align-items:flex-end;gap:4px;height:160px;padding-top:10px;border-bottom:1px solid var(--line)}
  .bars div{flex:1;background:var(--sauge);border-radius:4px 4px 0 0;min-height:2px;position:relative}
  .bars div:hover{background:var(--osb)}
  .barlbl{display:flex;gap:4px;font-size:10px;color:var(--muted)}
  .barlbl span{flex:1;text-align:center;overflow:hidden}
  .periods{display:flex;gap:6px;flex-wrap:wrap}
  .periods button.on{background:var(--ink);color:#fff}
  .pay .btn{padding:16px 8px;font-size:16px}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal .box{background:#fff;border-radius:var(--r);padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
  .hidden{display:none!important}
  /* Ticket */
  #ticket{font-family:"Courier New",monospace;font-size:13px;width:72mm;margin:0 auto;color:#000}
  #ticket .c{text-align:center} #ticket hr{border:0;border-top:1px dashed #000}
  #ticket .l{display:flex;justify-content:space-between;gap:6px}
  /* Étiquettes */
  #labels{display:flex;flex-wrap:wrap;gap:6px}
  .label{width:62mm;border:1px dashed #bbb;padding:6px;text-align:center;font-size:11px;background:#fff}
  .label .p{font-size:15px;font-weight:700}
  @media print{
    body *{visibility:hidden}
    .print-zone,.print-zone *{visibility:visible}
    .print-zone{position:absolute;left:0;top:0;width:100%}
    .modal{background:none}
    .label{border:0;break-inside:avoid}
  }
</style>
</head>
<body>
<header>
  <h1 id="titre">Marché des Artisans et Producteurs</h1>
  <div class="who"><span id="who"></span> <button class="btn small ghost hidden" id="btnLogout">Se déconnecter</button></div>
</header>
<nav id="nav" class="hidden"></nav>
<main id="app"></main>

<div class="modal hidden" id="modal"><div class="box" id="modalBox"></div></div>

<script>
// ================== Outils ==================
const $ = (s, el = document) => el.querySelector(s);
const app = $("#app");
const eur = (c) => ((c || 0) / 100).toLocaleString("fr-FR", { style: "currency", currency: "EUR" });
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const thisMonth = () => new Date().toISOString().slice(0, 7);
const fdate = (iso) => new Date(iso).toLocaleString("fr-FR", { dateStyle: "short", timeStyle: "short" });
let S = { token: localStorage.getItem("token"), role: localStorage.getItem("role"), nom: localStorage.getItem("nom"), cle: localStorage.getItem("cleCaisse"), settings: {} };

async function api(path, opts = {}) {
  const headers = { "content-type": "application/json" };
  if (S.token) headers.authorization = "Bearer " + S.token;
  if (S.cle) headers["x-caisse"] = S.cle;
  const r = await fetch("/api" + path, { method: opts.method || "GET", headers, body: opts.body ? JSON.stringify(opts.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && S.token && !path.startsWith("/login")) { logout(); throw new Error("Session expirée, reconnectez-vous"); }
  if (!r.ok) throw new Error(d.erreur || "Erreur");
  return d;
}
function msg(el, text, type = "err") { el.innerHTML = text ? `<div class="msg ${type}">${esc(text)}</div>` : ""; }
function openModal(html) { $("#modalBox").innerHTML = html; $("#modal").classList.remove("hidden"); }
function closeModal() { $("#modal").classList.add("hidden"); $("#modal").classList.remove("print-zone"); }
$("#modal").addEventListener("click", (e) => { if (e.target.id === "modal") closeModal(); });

function setNav(items, active) {
  const nav = $("#nav");
  nav.classList.remove("hidden");
  nav.innerHTML = items.map(([k, l]) => `<button data-k="${k}" class="${k === active ? "on" : ""}">${l}</button>`).join("");
  nav.querySelectorAll("button").forEach((b) => (b.onclick = () => route(b.dataset.k)));
}
function logout() {
  localStorage.removeItem("token"); localStorage.removeItem("role"); localStorage.removeItem("nom");
  S.token = S.role = S.nom = null; start();
}
$("#btnLogout").onclick = logout;

// ================== Démarrage ==================
async function start() {
  try { S.settings = await api("/settings/public"); } catch {}
  $("#titre").textContent = S.settings.nomBoutique || "Caisse";
  document.title = "Caisse – " + (S.settings.nomBoutique || "");
  $("#who").textContent = S.nom ? S.nom : "";
  $("#btnLogout").classList.toggle("hidden", !S.token);
  if (!S.token) return showLogin();
  route(S.role === "admin" ? (S.cle ? "caisse" : "dashboard") : "catalogue");
}

function showLogin() {
  $("#nav").classList.add("hidden");
  app.innerHTML = `
  <div class="login card">
    <h2>Connexion</h2>
    <p class="muted">Artisans : connectez-vous pour gérer votre catalogue et suivre vos ventes.</p>
    <label>Identifiant</label><input id="lid" autocomplete="username">
    <label>Mot de passe</label><input id="lpw" type="password" autocomplete="current-password">
    <div id="lmsg"></div>
    <button class="btn" id="lgo" style="width:100%;margin-top:12px">Se connecter</button>
    ${S.cle ? `<hr style="margin:18px 0;border:0;border-top:1px solid var(--line)"><button class="btn osb" id="opencaisse" style="width:100%">Ouvrir la caisse</button><p class="muted">Ce poste est activé comme caisse du magasin.</p>` : ""}
  </div>`;
  const go = async () => {
    try {
      const d = await api("/login", { method: "POST", body: { identifiant: $("#lid").value, motdepasse: $("#lpw").value } });
      S.token = d.token; S.role = d.role; S.nom = d.nom;
      localStorage.setItem("token", d.token); localStorage.setItem("role", d.role); localStorage.setItem("nom", d.nom);
      start();
    } catch (e) { msg($("#lmsg"), e.message); }
  };
  $("#lgo").onclick = go;
  $("#lpw").onkeydown = (e) => { if (e.key === "Enter") go(); };
  if ($("#opencaisse")) $("#opencaisse").onclick = () => showCaisse();
}

function route(k) {
  const navA = [["caisse", "Caisse"], ["dashboard", "Tableau de bord et ventes"], ["artisans", "Artisans"], ["produits", "Catalogue"], ["parametres", "Paramètres"]];
  const navR = [["catalogue", "Mon catalogue"], ["mesventes", "Mes ventes"], ["compte", "Mon compte"]];
  if (S.role === "admin") {
    setNav(navA, k);
    ({ dashboard: adminDashboard, caisse: showCaisse, ventes: adminVentes, artisans: adminArtisans, produits: adminProduits, parametres: adminParametres }[k] || adminDashboard)();
  } else {
    setNav(navR, k);
    ({ catalogue: artisanCatalogue, mesventes: artisanVentes, compte: compteView }[k] || artisanCatalogue)();
  }
}

// ================== CAISSE ==================
let CART = [], PRODS = [];
async function showCaisse() {
  if (!S.cle) {
    app.innerHTML = `<div class="card"><h2>Caisse</h2><p>La caisse ne fonctionne que sur le poste du magasin.</p>
      ${S.role === "admin" ? `<p class="muted">Si vous êtes sur l'ordinateur de la boutique, activez-le comme caisse dans <b>Paramètres</b>.</p>` : ""}</div>`;
    return;
  }
  if (!S.token) { $("#nav").classList.add("hidden"); $("#btnLogout").classList.add("hidden"); }
  app.innerHTML = `
  <div class="caisse">
    <div class="card">
      <div class="row" style="align-items:center">
        <h2 style="margin:0">Caisse</h2>
        <div style="flex:0 0 auto" class="row">
          <button class="btn small ghost" id="cJour">Ventes du jour</button>
          ${S.role === "admin" && S.token ? `<button class="btn small ghost" id="cSortie">Sortie d'espèces</button>` : ""}
          <button class="btn small" id="cZ">Clôture / Ticket Z</button>
          <button class="btn small osb" id="cEtiq">Étiquettes</button>
          <button class="btn small ghost" id="cReload">Actualiser les articles</button>
          ${!S.token ? `<button class="btn small ghost" id="cQuit">Fermer la caisse</button>` : ""}
        </div>
      </div>
      <div id="cSession"></div>
      <input class="scan" id="scan" placeholder="Scanner ou taper une référence / un nom d'article" autofocus autocomplete="off">
      <div id="cmsg"></div>
      <div class="results" id="results"></div>
    </div>
    <div class="card">
      <h2>Ticket en cours</h2>
      <div id="cart"></div>
      <div class="total" id="total">0,00 €</div>
      <div class="pay">
        <button class="btn" data-pay="CB">Carte</button>
        <button class="btn osb" data-pay="Espèces">Espèces</button>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn ghost small" id="cAtt">Mettre en attente</button>
        <button class="btn ghost small" id="cAttList">Tickets en attente</button>
        <button class="btn ghost small" id="cClear">Vider le panier</button></div>
    </div>
  </div>`;
  $("#cReload").onclick = loadProds;
  $("#cJour").onclick = venteDuJour;
  if ($("#cSortie")) $("#cSortie").onclick = sortieEspeces;
  $("#cZ").onclick = clotureCaisse;
  loadSession();
  $("#cEtiq").onclick = () => printLabels(PRODS);
  if ($("#cQuit")) $("#cQuit").onclick = showLogin;
  $("#cClear").onclick = () => { if (!CART.length) return; justifier("Vider le panier", { type: "panier", detail: CART.map((l) => l.qte + " × " + l.nom).join(", "), montant: CART.reduce((t, l) => t + l.prix * l.qte, 0) }, () => { CART = []; renderCart(); }); };
  $("#cAtt").onclick = mettreEnAttente;
  $("#cAttList").onclick = listeAttente;
  document.querySelectorAll("[data-pay]").forEach((b) => (b.onclick = () => payer(b.dataset.pay)));
  const scan = $("#scan");
  scan.oninput = () => renderResults(scan.value);
  scan.onkeydown = (e) => {
    if (e.key !== "Enter") return;
    const v = scan.value.trim().toUpperCase();
    const p = PRODS.find((x) => x.ref.toUpperCase() === v);
    if (p) { addToCart(p); scan.value = ""; renderResults(""); }
    else {
      const list = filterProds(scan.value);
      if (list.length === 1) { addToCart(list[0]); scan.value = ""; renderResults(""); }
      else msg($("#cmsg"), list.length ? "Plusieurs articles correspondent : cliquez sur le bon." : "Référence inconnue : " + scan.value);
    }
  };
  await loadProds();
  renderCart();
}
async function loadProds() {
  try { PRODS = await api("/caisse/produits"); msg($("#cmsg"), ""); renderResults($("#scan")?.value || ""); }
  catch (e) {
    if (/pas activé/.test(e.message)) { localStorage.removeItem("cleCaisse"); S.cle = null; }
    msg($("#cmsg"), e.message);
  }
}
function filterProds(q) {
  q = q.trim().toLowerCase();
  if (!q) return PRODS.slice(0, 40);
  return PRODS.filter((p) => p.ref.toLowerCase().includes(q) || p.nom.toLowerCase().includes(q) || (p.artisanNom || "").toLowerCase().includes(q)).slice(0, 60);
}
function renderResults(q) {
  const el = $("#results"); if (!el) return;
  const list = filterProds(q);
  el.innerHTML = list.map((p) => `
    <div class="prod" data-ref="${esc(p.ref)}">
      <div><b>${esc(p.nom)}</b><span class="muted">${esc(p.ref)} · ${esc(p.artisanNom)}${typeof p.stock === "number" ? " · stock " + p.stock : ""}</span></div>
      <div><b>${eur(p.prix)}</b></div>
    </div>`).join("") || `<p class="muted">Aucun article.</p>`;
  el.querySelectorAll(".prod").forEach((d) => (d.onclick = () => { addToCart(PRODS.find((p) => p.ref === d.dataset.ref)); $("#scan").value = ""; renderResults(""); $("#scan").focus(); }));
}
function addToCart(p) {
  const l = CART.find((x) => x.ref === p.ref);
  if (l) l.qte++; else CART.push({ ref: p.ref, nom: p.nom, prix: p.prix, artisanNom: p.artisanNom, qte: 1 });
  msg($("#cmsg"), ""); renderCart();
}
function renderCart() {
  const el = $("#cart"); if (!el) return;
  el.innerHTML = CART.map((l, i) => `
    <div class="cart-line">
      <div><b>${esc(l.nom)}</b><div class="muted">${esc(l.ref)} · ${esc(l.artisanNom)}</div></div>
      <div class="qty"><button data-i="${i}" data-d="-1">−</button><span>${l.qte}</span><button data-i="${i}" data-d="1">+</button></div>
      <div class="num"><b>${eur(l.prix * l.qte)}</b></div>
      <button class="btn small ghost" data-del="${i}">✕</button>
    </div>`).join("") || `<p class="muted">Scannez un article pour commencer.</p>`;
  const supprimer = (i, n) => { const l = CART[i]; justifier("Retirer un article du panier", { type: "ligne", detail: n + " × " + l.nom + " (" + l.artisanNom + ")", montant: l.prix * n }, () => { l.qte -= n; if (l.qte < 1) CART.splice(i, 1); renderCart(); }); };
  el.querySelectorAll("[data-d]").forEach((b) => (b.onclick = () => { const i = +b.dataset.i; if (+b.dataset.d > 0) { CART[i].qte++; renderCart(); } else supprimer(i, 1); }));
  el.querySelectorAll("[data-del]").forEach((b) => (b.onclick = () => supprimer(+b.dataset.del, CART[+b.dataset.del].qte)));
  $("#total").textContent = eur(CART.reduce((s, l) => s + l.prix * l.qte, 0));
}
const estGerant = () => S.role === "admin" && !!S.token;
// Demande une justification (sauf pour la gérance), l'enregistre dans le journal puis exécute l'action
function justifier(titre, infos, action, appel) {
  const envoyer = async (motif, par) => {
    if (appel) return appel(motif, par);
    await api("/caisse/journal", { method: "POST", body: { ...infos, motif, par } });
  };
  if (estGerant()) { envoyer("", "").then(action).catch((e) => alert(e.message)); return; }
  openModal(`<h2>${esc(titre)}</h2><p class="muted">Une justification est demandée. Elle sera transmise à la gérance.</p>
    ${infos.detail ? `<p><b>${esc(infos.detail)}</b></p>` : ""}
    <label>Votre nom *</label><input id="jPar"><label>Justification *</label><textarea id="jMot" placeholder="ex. erreur de saisie, client a changé d'avis…"></textarea>
    <div id="jmsg"></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn danger" id="jGo">Confirmer</button></div>`);
  $("#jGo").onclick = async () => {
    const par = $("#jPar").value.trim(), motif = $("#jMot").value.trim();
    if (!par || !motif) return msg($("#jmsg"), "Nom et justification obligatoires.");
    try { await envoyer(motif, par); closeModal(); action(); } catch (e) { msg($("#jmsg"), e.message); }
  };
}
async function mettreEnAttente() {
  if (!CART.length) return msg($("#cmsg"), "Le panier est vide.");
  const nom = prompt("Nom ou repère du client (facultatif) :", "");
  if (nom === null) return;
  try { await api("/caisse/attente", { method: "POST", body: { nom, lignes: CART } }); CART = []; renderCart(); msg($("#cmsg"), "Ticket mis en attente.", "ok"); }
  catch (e) { msg($("#cmsg"), e.message); }
}
async function listeAttente() {
  const L = await api("/caisse/attente");
  openModal(`<h2>Tickets en attente</h2>
    <table>${L.map((t, i) => `<tr><td><b>${esc(t.nom || "Sans nom")}</b><div class="muted">${fdate(t.date)} · ${t.lignes.reduce((s, l) => s + l.qte, 0)} art.</div></td><td class="num">${eur(t.lignes.reduce((s, l) => s + l.prix * l.qte, 0))}</td>
      <td class="num"><button class="btn small" data-rep="${i}">Reprendre</button> <button class="btn small ghost" data-sup="${i}">Supprimer</button></td></tr>`).join("") || "<tr><td class='muted'>Aucun ticket en attente.</td></tr>"}</table>
    <button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Fermer</button>`);
  document.querySelectorAll("[data-rep]").forEach((b) => (b.onclick = async () => {
    const t = L[b.dataset.rep];
    if (CART.length && !confirm("Le panier en cours sera remplacé. Continuer ?")) return;
    CART = t.lignes.map((l) => { const p = PRODS.find((x) => x.ref === l.ref); return p ? { ...l, prix: p.prix, nom: p.nom } : l; });
    await api("/caisse/attente/" + t.id, { method: "DELETE" }); closeModal(); renderCart();
  }));
  document.querySelectorAll("[data-sup]").forEach((b) => (b.onclick = () => { const t = L[b.dataset.sup];
    justifier("Supprimer un ticket en attente", { type: "panier", detail: (t.nom || "Ticket en attente") + " : " + t.lignes.map((l) => l.qte + " × " + l.nom).join(", "), montant: t.lignes.reduce((s, l) => s + l.prix * l.qte, 0) },
      async () => { await api("/caisse/attente/" + t.id, { method: "DELETE" }); listeAttente(); }); }));
}

function payer(mode) {
  if (!CART.length) return msg($("#cmsg"), "Le panier est vide.");
  const total = CART.reduce((s, l) => s + l.prix * l.qte, 0);
  const esp = mode === "Espèces";
  openModal(`
    <h2>Paiement : ${esc(mode)}</h2>
    <div class="total">${eur(total)}</div>
    ${esp ? `<label>Montant donné par le client (€)</label><input id="recu" inputmode="decimal" placeholder="ex. 50" style="font-size:22px">
      <div class="quick">${[[total / 100, "Montant exact"], [10, "10 €"], [20, "20 €"], [50, "50 €"], [100, "100 €"]].filter(([v]) => v * 100 >= total).map(([v, l]) => `<button class="btn small ghost" data-q="${v}">${l}</button>`).join("")}</div>
      <div id="rendu" class="rendu hidden"></div>` : ""}
    <div id="pmsg"></div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" id="pAnn">Annuler</button><button class="btn" id="pOk">Valider l'encaissement</button></div>`);
  const majRendu = () => {
    const r = Math.round(parseFloat($("#recu").value.replace(",", ".")) * 100) || 0;
    const el = $("#rendu");
    if (!r) { el.classList.add("hidden"); return; }
    el.classList.remove("hidden");
    el.classList.toggle("manque", r < total);
    el.textContent = r >= total ? "À rendre : " + eur(r - total) : "Il manque " + eur(total - r);
  };
  if (esp) {
    $("#recu").oninput = majRendu;
    document.querySelectorAll("[data-q]").forEach((b) => (b.onclick = () => { $("#recu").value = String(b.dataset.q).replace(".", ","); majRendu(); }));
    setTimeout(() => $("#recu").focus(), 50);
  }
  $("#pAnn").onclick = closeModal;
  $("#pOk").onclick = async () => {
    if (esp) {
      const r = Math.round(parseFloat(($("#recu").value || "0").replace(",", ".")) * 100) || 0;
      if (r && r < total) return msg($("#pmsg"), "Le montant donné est inférieur au total.");
    }
    $("#pOk").disabled = true;
    try {
      const v = await api("/caisse/ventes", { method: "POST", body: { lignes: CART.map((l) => ({ ref: l.ref, qte: l.qte })), paiement: { mode, recu: $("#recu")?.value || null } } });
      CART = []; renderCart(); loadProds();
      showTicket(v);
    } catch (e) { msg($("#pmsg"), e.message); $("#pOk").disabled = false; }
  };
}

    <div class="c"><b>${esc(s.nomBoutique)}</b>${s.adresse ? "<br>" + esc(s.adresse) : ""}</div>
    <div class="c">${fdate(v.date)} · Ticket ${esc(v.numero)}</div>
    ${v.annulee ? '<div class="c"><b>*** VENTE ANNULÉE ***</b></div>' : ""}
    <hr>
    ${v.lignes.map((l) => `<div>${esc(l.nom)}</div>
      <div class="l"><span>${l.qte} x ${eur(l.pu)}</span><span>${eur(l.total)}</span></div>
      <div style="font-size:11px">Réf. ${esc(l.ref)} – vendu pour le compte de ${esc(l.artisanNom)}</div>`).join("<div style='height:4px'></div>")}
    <hr>
    <div class="l"><b>TOTAL</b><b>${eur(v.total)}</b></div>

}
function showTicket(v) {
  openModal(`${v.paiement.recu && !v.annulee ? `<div class="rendu" style="margin-bottom:12px">À rendre : ${eur(v.paiement.recu - v.total)}</div>` : ""}${ticketHTML(v)}<div class="row" style="margin-top:14px"><button class="btn ghost" id="tClose">Fermer</button><button class="btn" id="tPrint">Imprimer le ticket</button></div>`);
  $("#tClose").onclick = () => { closeModal(); $("#scan")?.focus(); };
  $("#tPrint").onclick = () => { $("#modal").classList.add("print-zone"); window.print(); $("#modal").classList.remove("print-zone"); };

const COUPURES = [500, 200, 100, 50, 20, 10, 5, 2, 1, 0.5, 0.2, 0.1, 0.05, 0.02, 0.01];
const coupLabel = (v) => v >= 5 ? `Billet ${v} €` : v >= 1 ? `Pièce ${v} €` : `Pièce ${Math.round(v * 100)} c`;
let SESSION = null;
function comptageHTML(id, init = {}) {
  return `<div id="${id}">${COUPURES.map((v) => `<div class="row" style="align-items:center;margin-bottom:4px;gap:6px">
    <span style="min-width:110px;flex:0 0 auto">${coupLabel(v)}</span>
    <span class="qty" style="flex:0 0 auto"><button type="button" data-m="-1">−</button><input data-v="${v}" type="number" min="0" value="${init[v] || 0}" style="width:64px;text-align:center;padding:6px"><button type="button" data-m="1">+</button></span>
    <span class="muted" data-st="${v}" style="text-align:right">${eur(Math.round(v * 100) * (init[v] || 0))}</span></div>`).join("")}
    <div class="total" data-tot>0,00 €</div></div>`;
}
function bindComptage(id, onChange) {
  const root = $("#" + id);
  const read = () => { const c = {}; root.querySelectorAll("[data-v]").forEach((i) => { const n = parseInt(i.value, 10) || 0; if (n) c[i.dataset.v] = n; }); return c; };
  const upd = () => {
    let t = 0;
    root.querySelectorAll("[data-v]").forEach((i) => { const st = Math.round(Number(i.dataset.v) * 100) * (parseInt(i.value, 10) || 0); t += st; root.querySelector(`[data-st="${i.dataset.v}"]`).textContent = eur(st); });
    root.querySelector("[data-tot]").textContent = "Total compté : " + eur(t);
    onChange && onChange(t, read());
  };
  root.querySelectorAll("[data-m]").forEach((b) => (b.onclick = () => { const i = b.parentElement.querySelector("input"); i.value = Math.max(0, (parseInt(i.value, 10) || 0) + Number(b.dataset.m)); upd(); }));
  root.querySelectorAll("[data-v]").forEach((i) => (i.oninput = upd));
  upd();
  return read;
}
async function loadSession() {
  try { SESSION = await api("/caisse/session"); } catch { return; }
  const el = $("#cSession"); if (!el) return;
  if (SESSION.z) el.innerHTML = `<div class="msg ok">Caisse clôturée aujourd'hui à ${new Date(SESSION.z.heure).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}. <button class="btn small ghost" id="reZ">Réimprimer le Z</button></div>`;
  else if (!SESSION.ouverture) el.innerHTML = `<div class="msg err">Fond de caisse du matin non validé. <button class="btn small osb" id="goOuv">Ouvrir la caisse et compter le fond</button></div>`;
  else el.innerHTML = `<div class="muted" style="margin:6px 0">Caisse ouverte à ${new Date(SESSION.ouverture.heure).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}${SESSION.ouverture.vendeur ? " par " + esc(SESSION.ouverture.vendeur) : ""} · fond ${eur(SESSION.ouverture.total)}</div>`;
  if ($("#goOuv")) $("#goOuv").onclick = ouvertureCaisse;
  if ($("#reZ")) $("#reZ").onclick = () => printZ(SESSION.z);
}
function ouvertureCaisse() {
  const fond = SESSION?.fondReserve ?? 8000;
  openModal(`<h2>Ouverture de caisse</h2><p class="muted">Comptez le tiroir. Le fond de caisse attendu est de <b>${eur(fond)}</b>.</p>
    <label>Votre nom</label><input id="oVend" placeholder="Qui ouvre la caisse ?">
    ${comptageHTML("oCpt")}<div id="oEcart"></div><div id="omsg"></div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="oGo">Valider l'ouverture</button></div>`);
  const read = bindComptage("oCpt", (t) => {
    const e = t - fond;
    $("#oEcart").innerHTML = e === 0 ? `<div class="msg ok">Le fond est juste.</div>` : `<div class="msg err">Écart de ${e > 0 ? "+" : ""}${eur(e)} par rapport aux ${eur(fond)} attendus. Recomptez le tiroir.</div>`;
  });
  $("#oGo").onclick = async () => {
    if (!$("#oVend").value.trim()) return msg($("#omsg"), "Indiquez votre nom.");
    try { await api("/caisse/ouverture", { method: "POST", body: { vendeur: $("#oVend").value, comptage: read() } }); closeModal(); loadSession(); }
    catch (e) { msg($("#omsg"), e.message); }
  };
}

}
async function clotureCaisse() {

    <div class="row"><span><b>= Attendu</b></span><b style="text-align:right">${eur(z.attendu)}</b></div>
    <h3>Comptez le tiroir</h3>

    ${comptageHTML("fCpt")}<div id="fRes"></div>

      <div class="rendu">À déposer en banque : ${eur(dep)}<div style="font-size:13px;font-weight:400">On laisse ${eur(z.fondReserve)} dans le tiroir pour demain.</div></div>`;

      ${L("Nombre de clients (tickets)", z.nbVentes, "b")}${L("Articles vendus", z.articles)}${L("Panier moyen", eur(z.panierMoyen))}
      ${L("CHIFFRE D'AFFAIRES TTC", eur(z.ca), "t")}
      ${z.annulations.nb ? L(`Ventes annulées (${z.annulations.nb})`, eur(z.annulations.montant)) : ""}</table>
    <h2>Encaissements</h2><table>
      ${L("Carte bancaire", eur(z.parMode["CB"] || 0), "b")}${L("Espèces", eur(z.parMode["Espèces"] || 0), "b")}
      ${L("TOTAL ENCAISSÉ", eur(z.ca), "t")}</table>
    <h2>Fond de caisse</h2><table>

      ${L("Espèces encaissées", eur(z.especes))}
      ${z.sorties.map((x) => L("Sortie d'espèces : " + esc(x.motif), "−" + eur(x.montant))).join("")}
      ${L("Espèces attendues", eur(z.attendu), "b")}
      ${L("Total compté à la fermeture", eur(z.fondFermeture), "b")}
      ${L("Écart", (z.ecart > 0 ? "+" : "") + eur(z.ecart), Math.abs(z.ecart) <= 100 ? "ok" : "ko")}
      ${L("Fond laissé dans le tiroir", eur(Math.min(z.fondReserve, z.fondFermeture)))}
      ${L("À DÉPOSER EN BANQUE", eur(z.aDeposer), "t")}</table>
    <h2>Ventes par artisan</h2><table>
      ${z.parArtisan.map((r) => L(esc(r.artisanNom) + ` (${r.articles} art.)`, eur(r.ca))).join("") || L("Aucune vente", "")}

async function venteDuJour() {
  try {
    const d = await api("/caisse/jour");
    openModal(`<h2>Ventes du ${new Date().toLocaleDateString("fr-FR")}</h2>
      <div class="kpis"><div class="kpi"><div class="l">Total</div><div class="v">${eur(d.total)}</div></div><div class="kpi"><div class="l">Tickets</div><div class="v">${d.nbVentes}</div></div></div>
      ${Object.entries(d.parMode).map(([k, v]) => `<div class="row"><span>${esc(k)}</span><b style="text-align:right">${eur(v)}</b></div>`).join("")}
      <h3>Tickets</h3>
      <table>${d.ventes.map((v, i) => `<tr><td>${new Date(v.date).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })}<div class="muted">${v.lignes.map((l) => l.qte + " × " + esc(l.nom)).join("<br>")}</div></td><td>${esc(v.paiement.mode)}${v.annulee ? ' <span class="tag off">annulée</span>' : ""}</td><td class="num">${eur(v.total)}</td>
        <td class="num"><button class="btn small ghost" data-tk="${i}">Ticket</button>${v.annulee ? "" : ` <button class="btn small ghost" data-al="${i}">Annuler une ligne</button> <button class="btn small danger" data-at="${i}">Annuler le ticket</button>`}</td></tr>`).join("") || "<tr><td>Aucune vente</td></tr>"}</table>
      <button class="btn ghost" style="margin-top:12px" onclick="closeModal()">Fermer</button>`);
    const annuler = (v, ligne, titre, detail) => justifier(titre, { detail }, () => venteDuJour(),
      (motif, par) => api(`/caisse/ventes/${v.date.slice(0, 7)}/${v.id}/annuler`, { method: "POST", body: { ligne, motif, par } }));
    document.querySelectorAll("[data-tk]").forEach((b) => (b.onclick = () => showTicket(d.ventes[b.dataset.tk])));
    document.querySelectorAll("[data-at]").forEach((b) => (b.onclick = () => { const v = d.ventes[b.dataset.at]; if (estGerant() && !confirm("Annuler ce ticket de " + eur(v.total) + " ?")) return; annuler(v, null, "Annuler le ticket", `Ticket de ${eur(v.total)}`); }));
    document.querySelectorAll("[data-al]").forEach((b) => (b.onclick = () => {
      const v = d.ventes[b.dataset.al];
      openModal(`<h2>Quelle ligne annuler ?</h2><table>${v.lignes.map((l, i) => `<tr><td>${l.qte} × ${esc(l.nom)}<div class="muted">${esc(l.artisanNom)}</div></td><td class="num">${eur(l.total)}</td><td class="num"><button class="btn small danger" data-li="${i}">Annuler</button></td></tr>`).join("")}</table><button class="btn ghost" style="margin-top:12px" id="liBack">Retour</button>`);
      $("#liBack").onclick = venteDuJour;
      document.querySelectorAll("[data-li]").forEach((x) => (x.onclick = () => { const l = v.lignes[x.dataset.li]; annuler(v, +x.dataset.li, "Annuler une ligne", `${l.qte} × ${l.nom} (${l.artisanNom}) – ${eur(l.total)}`); }));
    }));
  } catch (e) { msg($("#cmsg"), e.message); }
}

function barcodeSVG(code) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  try { JsBarcode(svg, code, { format: "CODE128", displayValue: false, margin: 0, height: 40, width: 2 }); } catch {}
  svg.setAttribute("preserveAspectRatio", "none");
  return svg.outerHTML;
}

// ---- Périodes (heure locale) ----
function ymd(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function periodeDates(k) {
  const n = new Date(), y = n.getFullYear(), m = n.getMonth();
  if (k === "jour") return [ymd(n), ymd(n)];
  if (k === "semaine") { const l = new Date(n); l.setDate(n.getDate() - ((n.getDay() + 6) % 7)); const f = new Date(l); f.setDate(l.getDate() + 6); return [ymd(l), ymd(f)]; }
  if (k === "mois") return [ymd(new Date(y, m, 1)), ymd(new Date(y, m + 1, 0))];
  if (k === "trimestre") { const q = Math.floor(m / 3) * 3; return [ymd(new Date(y, q, 1)), ymd(new Date(y, q + 3, 0))]; }
}
function periodPicker(onChange, initial = "mois") {
  const libs = [["jour", "Aujourd'hui"], ["semaine", "Cette semaine"], ["mois", "Ce mois-ci"], ["trimestre", "Ce trimestre"], ["perso", "Dates au choix"]];
  const html = `<div class="card"><div class="periods" id="per">${libs.map(([k, l]) => `<button class="btn small ghost ${k === initial ? "on" : ""}" data-p="${k}">${l}</button>`).join("")}</div>
    <div class="row hidden" id="perso" style="margin-top:10px"><div><label>Du</label><input type="date" id="pDu"></div><div><label>Au</label><input type="date" id="pAu"></div><div style="flex:0 0 auto"><button class="btn" id="pGo">Afficher</button></div></div></div>`;
  const bind = () => {
    document.querySelectorAll("#per [data-p]").forEach((b) => (b.onclick = () => {
      document.querySelectorAll("#per [data-p]").forEach((x) => x.classList.toggle("on", x === b));
      $("#perso").classList.toggle("hidden", b.dataset.p !== "perso");
      if (b.dataset.p !== "perso") onChange(...periodeDates(b.dataset.p));
    }));
    $("#pGo").onclick = () => $("#pDu").value && $("#pAu").value && onChange($("#pDu").value, $("#pAu").value);
    onChange(...periodeDates(initial));
  };
  return { html, bind };
}
const fd = (d) => new Date(d + "T12:00:00").toLocaleDateString("fr-FR");
function barres(data, val, lbl) {
  if (!data.length) return `<p class="muted">Pas de données.</p>`;
  const max = Math.max(...data.map(val), 1);
  return `<div class="bars">${data.map((d) => `<div style="height:${Math.round((val(d) / max) * 100)}%" title="${esc(lbl(d))} : ${eur(val(d))}"></div>`).join("")}</div>
    <div class="barlbl">${data.map((d) => `<span>${esc(lbl(d))}</span>`).join("")}</div>`;
}

    $("#jl").innerHTML = `<h2>Annulations et justifications</h2><p class="muted">Lignes retirées, paniers vidés, tickets annulés ou modifiés, avec la justification donnée.</p>
      <table><tr><th>Date</th><th>Action</th><th>Détail</th><th class="num">Montant</th><th>Par</th><th>Justification</th></tr>
      ${J.map((j) => `<tr><td>${fdate(j.date)}</td><td>${esc(j.type)}</td><td>${esc(j.detail || (j.ticket ? "Ticket " + j.ticket : ""))}</td><td class="num">${eur(j.montant)}</td><td>${esc(j.par)}</td><td>${esc(j.motif) || '<span class="muted">—</span>'}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">Rien ce mois-ci.</td></tr>`}</table>`;
    $("#zl").innerHTML = `<h2>Tickets Z (clôtures de caisse)</h2><table><tr><th>Jour</th><th>Clôturé par</th><th class="num">CA</th><th class="num">Écart</th><th class="num">À déposer</th><th></th></tr>
      ${Z.map((z, i) => `<tr><td>${fd(z.jour)}</td><td>${esc(z.vendeur)}</td><td class="num">${eur(z.ca)}</td><td class="num" style="color:${Math.abs(z.ecart) <= 100 ? "inherit" : "var(--rouge)"}">${eur(z.ecart)}</td><td class="num">${eur(z.aDeposer)}</td><td class="num"><button class="btn small ghost" data-z="${i}">Imprimer</button></td></tr>`).join("") || `<tr><td colspan="6" class="muted">Aucune clôture ce mois-ci.</td></tr>`}</table>`;
    $("#zl").querySelectorAll("[data-z]").forEach((b) => (b.onclick = () => printZ(Z[b.dataset.z])));
  };
  $("#vq").oninput = renderV;
  $("#mois").onchange = load; load();
}
function modifierTicket(v, done) {
  const L = v.lignes.map((l) => ({ ref: l.ref, nom: l.nom, artisanNom: l.artisanNom, qte: l.qte, pu: (l.pu / 100).toFixed(2).replace(".", ",") }));
  const draw = () => {
    openModal(`<h2>Modifier le ticket ${esc(v.numero)}</h2>
      <table>${L.map((l, i) => `<tr><td>${esc(l.nom)}<div class="muted">${esc(l.ref)} · ${esc(l.artisanNom)}</div></td>
        <td style="width:70px"><input type="number" min="0" value="${l.qte}" data-q="${i}"></td><td style="width:90px"><input inputmode="decimal" value="${l.pu}" data-p="${i}"></td></tr>`).join("")}</table>
      <p class="muted">Quantité 0 = ligne retirée. Le prix modifié ne change que ce ticket.</p>
      <div class="row"><div><label>Ajouter un article (référence)</label><input id="mAdd" placeholder="ex. MD004"></div><div style="flex:0 0 auto"><button class="btn small ghost" id="mAddGo">Ajouter</button></div></div>
      <label>Paiement</label><select id="mMode"><option ${v.paiement.mode === "CB" ? "selected" : ""}>CB</option><option ${v.paiement.mode === "Espèces" ? "selected" : ""}>Espèces</option></select>
      <label>Note (facultatif)</label><input id="mMot">
      <div id="mmsg"></div><div class="row" style="margin-top:10px"><button class="btn ghost" onclick="closeModal()">Annuler</button><button class="btn" id="mGo">Enregistrer</button></div>`);
    document.querySelectorAll("[data-q]").forEach((x) => (x.oninput = () => (L[x.dataset.q].qte = x.value)));
    document.querySelectorAll("[data-p]").forEach((x) => (x.oninput = () => (L[x.dataset.p].pu = x.value)));
    $("#mAddGo").onclick = () => { const r = $("#mAdd").value.trim().toUpperCase(); if (r) { L.push({ ref: r, nom: r, artisanNom: "", qte: 1, pu: "" }); draw(); } };
    $("#mGo").onclick = async () => {
      try { await api(`/ventes/${v.date.slice(0, 7)}/${v.id}`, { method: "PUT", body: { lignes: L, mode: $("#mMode").value, motif: $("#mMot").value } }); closeModal(); done(); }
      catch (e) { msg($("#mmsg"), e.message); }
    };
  };
  draw();
}

function finEngagement(ymd) { const d = new Date(ymd + "T12:00:00"); d.setMonth(d.getMonth() + 3); d.setDate(d.getDate() - 1); return d.toLocaleDateString("fr-FR"); }
async function adminArtisans() {
  app.innerHTML = `<div class="grid2">
    <div class="card"><h2>Ajouter un artisan</h2>
      <div class="row"><div><label>Nom affiché *</label><input id="aNom" placeholder="ex. Marie Dupont – Bijoux"></div><div style="max-width:120px"><label>Initiales *</label><input id="aIni" maxlength="4" placeholder="MD"></div></div>
      <div class="row"><div><label>Identifiant de connexion *</label><input id="aId" placeholder="ex. marie.dupont"></div><div><label>Mot de passe provisoire *</label><input id="aPw"></div></div>
      <div class="row"><div><label>Métier</label><input id="aMet"></div><div><label>Stand</label><select id="aStand"><option>1 m</option><option>2 m</option></select></div></div>
      <label>Date de début du contrat</label><input type="date" id="aDeb">
      <div class="row"><div><label>Téléphone</label><input id="aTel"></div><div><label>E-mail</label><input id="aMail"></div></div>
      <div id="amsg"></div><button class="btn" id="aGo" style="margin-top:10px">Créer le compte</button>
      <p class="muted">Les références de ses articles commenceront par ses initiales (ex. MD001).</p></div>
    <div class="card"><h2>Artisans</h2><div id="alist"></div></div></div>`;
  const load = async () => {
    const A = await api("/artisans");
    $("#alist").innerHTML = `<table><tr><th>Artisan</th><th>Identifiant</th><th>Stand</th><th>Contrat</th><th></th></tr>
      ${A.map((a) => `<tr><td><b>${esc(a.initiales)}</b> ${esc(a.nom)}<div class="muted">${esc(a.metier)} ${esc(a.telephone)}</div>${a.actif ? "" : '<span class="tag off">désactivé</span>'}</td><td>${esc(a.identifiant)}</td><td>${esc(a.stand)}</td><td>${a.dateDebut ? "Début : " + new Date(a.dateDebut + "T12:00:00").toLocaleDateString("fr-FR") + `<div class="muted">Engagement jusqu'au ${finEngagement(a.dateDebut)}</div>` : `<span class="muted">non renseigné</span>`}<div><button class="btn small ghost" data-deb="${a.id}" data-v="${esc(a.dateDebut || "")}">Modifier la date</button></div></td>
      <td class="num"><button class="btn small ghost" data-pw="${a.id}">Nouveau mot de passe</button> <button class="btn small ${a.actif ? "ghost" : ""}" data-act="${a.id}" data-v="${a.actif ? 0 : 1}">${a.actif ? "Désactiver" : "Réactiver"}</button></td></tr>`).join("") || `<tr><td colspan="4" class="muted">Aucun artisan.</td></tr>`}</table>`;
    $("#alist").querySelectorAll("[data-pw]").forEach((b) => (b.onclick = async () => {
      const pw = prompt("Nouveau mot de passe (6 caractères min.) :"); if (!pw) return;
      try { await api("/artisans/" + b.dataset.pw, { method: "PUT", body: { motdepasse: pw } }); alert("Mot de passe modifié."); } catch (e) { alert(e.message); }
    }));
    $("#alist").querySelectorAll("[data-deb]").forEach((b) => (b.onclick = async () => {
      const d = prompt("Date de début du contrat (format AAAA-MM-JJ, ex. 2027-01-05) :", b.dataset.v); if (d === null) return;
      if (d && !/^\d{4}-\d{2}-\d{2}$/.test(d)) return alert("Format attendu : AAAA-MM-JJ");
      await api("/artisans/" + b.dataset.deb, { method: "PUT", body: { dateDebut: d } }); load();
    }));
    $("#alist").querySelectorAll("[data-act]").forEach((b) => (b.onclick = async () => { await api("/artisans/" + b.dataset.act, { method: "PUT", body: { actif: b.dataset.v === "1" } }); load(); }));
  };
  $("#aGo").onclick = async () => {
    try {
      const a = await api("/artisans", { method: "POST", body: { nom: $("#aNom").value, initiales: $("#aIni").value, identifiant: $("#aId").value, motdepasse: $("#aPw").value, metier: $("#aMet").value, stand: $("#aStand").value, dateDebut: $("#aDeb").value, telephone: $("#aTel").value, email: $("#aMail").value } });
      msg($("#amsg"), `Compte créé : identifiant « ${a.identifiant} », initiales ${a.initiales}.`, "ok");
      ["aNom", "aIni", "aId", "aPw", "aMet", "aTel", "aMail", "aDeb"].forEach((i) => ($("#" + i).value = "")); load();
    } catch (e) { msg($("#amsg"), e.message); }
  };
  load();
}

async function adminProduits() {
  app.innerHTML = `<div class="card"><div class="row" style="align-items:center"><h2 style="margin:0">Catalogue complet</h2><button class="btn small osb" id="admEtiq" style="flex:0 0 auto">Imprimer des étiquettes</button></div><input id="q" style="margin-top:10px" placeholder="Rechercher un article, une référence, un artisan"><div id="pl" style="margin-top:10px"></div></div>`;
  const [P, A] = await Promise.all([api("/produits"), api("/artisans")]);
  const noms = Object.fromEntries(A.map((a) => [a.id, a.nom]));
  const render = () => {
    const q = $("#q").value.toLowerCase();
    const list = P.filter((p) => !q || p.nom.toLowerCase().includes(q) || p.ref.toLowerCase().includes(q) || (noms[p.artisanId] || "").toLowerCase().includes(q));
    $("#pl").innerHTML = `<table><tr><th>Réf.</th><th>Article</th><th>Artisan</th><th class="num">Prix</th><th class="num">Stock</th></tr>
      ${list.map((p) => `<tr><td><b>${esc(p.ref)}</b></td><td>${esc(p.nom)}${p.actif === false ? ' <span class="tag off">retiré</span>' : ""}</td><td>${esc(noms[p.artisanId])}</td><td class="num">${eur(p.prix)}</td><td class="num">${p.stock ?? "–"}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">Aucun article.</td></tr>`}</table>`;
  };
  $("#q").oninput = render; render();
  $("#admEtiq").onclick = () => printLabels(P.filter((p) => p.actif !== false).map((p) => ({ ...p, artisanNom: noms[p.artisanId] })));
}

async function adminParametres() {
  const s = await api("/settings");
  const postes = await api("/postes");
  app.innerHTML = `<div class="grid2">
    <div class="card"><h2>Boutique</h2>
      <label>Nom de la boutique (affiché sur les tickets)</label><input id="sNom" value="${esc(s.nomBoutique)}">
      <label>Adresse (ticket)</label><input id="sAdr" value="${esc(s.adresse)}">
      <label>Commission de la boutique (%)</label><input id="sCom" type="number" value="${s.commission}">
      <label>Fond de caisse laissé dans le tiroir (€)</label><input id="sFond" inputmode="decimal" value="${(s.fondReserve / 100).toFixed(2).replace(".", ",")}">
      <div id="smsg"></div><button class="btn" id="sGo" style="margin-top:10px">Enregistrer</button></div>
    <div class="card"><h2>Poste caisse</h2>
      <p class="muted">L'encaissement ne fonctionne que sur un poste activé. Activez uniquement l'ordinateur ou la tablette de la boutique.</p>
      <p>Ce poste : ${S.cle ? '<span class="tag">activé comme caisse</span>' : '<span class="tag off">non activé</span>'}</p>
      ${S.cle ? `<button class="btn ghost" id="desact">Désactiver ce poste</button>` : `<label>Nom du poste</label><input id="pNom" value="Caisse boutique"><button class="btn osb" id="act" style="margin-top:10px">Activer ce poste comme caisse</button>`}
      <h3>Postes activés</h3>
      <table>${postes.filter((p) => !p.revoque).map((p) => `<tr><td>${esc(p.nom)}<div class="muted">depuis le ${fdate(p.creeLe)}</div></td><td class="num"><button class="btn small danger" data-rev="${p.id}">Révoquer</button></td></tr>`).join("") || "<tr><td class='muted'>Aucun poste.</td></tr>"}</table>
    </div>
    <div class="card"><h2>Mot de passe gérance</h2><label>Nouveau mot de passe</label><input type="password" id="apw"><div id="apm"></div><button class="btn" id="apgo" style="margin-top:10px">Changer</button></div></div>`;
  $("#sGo").onclick = async () => {
    try { S.settings = await api("/settings", { method: "PUT", body: { nomBoutique: $("#sNom").value, adresse: $("#sAdr").value, commission: $("#sCom").value, fondReserve: $("#sFond").value } }); $("#titre").textContent = S.settings.nomBoutique; msg($("#smsg"), "Enregistré.", "ok"); }
    catch (e) { msg($("#smsg"), e.message); }
  };
  if ($("#act")) $("#act").onclick = async () => {
    const d = await api("/postes", { method: "POST", body: { nom: $("#pNom").value } });
    localStorage.setItem("cleCaisse", d.cle); S.cle = d.cle; adminParametres();
  };
  if ($("#desact")) $("#desact").onclick = () => { localStorage.removeItem("cleCaisse"); S.cle = null; adminParametres(); };
  document.querySelectorAll("[data-rev]").forEach((b) => (b.onclick = async () => { if (!confirm("Révoquer ce poste caisse ?")) return; await api("/postes/" + b.dataset.rev, { method: "DELETE" }); adminParametres(); }));
  $("#apgo").onclick = async () => {
    try { await api("/motdepasse", { method: "POST", body: { nouveau: $("#apw").value } }); msg($("#apm"), "Mot de passe modifié.", "ok"); } catch (e) { msg($("#apm"), e.message); }
  };
}

start();
</script>
